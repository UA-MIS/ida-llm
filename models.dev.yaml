    max_retries: 3
    tags: [local, campus, open-weights, deferred]
    serving:
      model_id: TODO-PLACEHOLDER-sparks-model-id
      serving_stack: vllm
      serving_version: null
      quantization: unknown
      revision: null
      context_window: 32768
      hardware: 1x DGX Spark GB10 128GB unified
      sampling:
        temperature: 0.0
        top_p: 1.0
        max_tokens: 2048
        seed: 20260101
    cost:
      input_usd_per_mtok: 0.0
      output_usd_per_mtok: 0.0

