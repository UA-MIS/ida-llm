# Local development stack. `make dev` brings this up; `make tracer` runs the
# end-to-end test against it.
#
# Everything here has an in-cluster counterpart:
#   postgres    -> CloudNativePG
#   minio       -> the platform MinIO tenant
#   redis       -> the redis Deployment in infra/k8s/base
#   mock-model  -> the mock-model Deployment (dev/PR-preview only)
# The api and runner containers are the SAME image, differing only by command.
#
# HOST PORTS ARE OVERRIDABLE. Every published port reads an env var with a
# sensible default, because a developer machine may already be running something
# on 9000 (MinIO's default is a popular port) or 5432. Nothing inside the stack
# uses these -- services reach each other by compose-network DNS on the
# container port -- so overriding them is always safe:
#
#   MINIO_PORT=9100 MINIO_CONSOLE_PORT=9101 make dev
#
# Copy the block into .env to make an override permanent.

name: capstone-ida

x-python-image: &python-image
  build:
    context: .
    dockerfile: Dockerfile.python
    args:
      GIT_SHA: ${GIT_SHA:-}

x-python-env: &python-env
  IDA_DATABASE_URL: postgresql+psycopg://ida:ida@postgres:5432/ida
  IDA_REDIS_URL: redis://redis:6379/0
  IDA_S3_ENDPOINT_URL: http://minio:9000
  IDA_S3_ACCESS_KEY: minioadmin
  IDA_S3_SECRET_KEY: minioadmin
  IDA_S3_BUCKET: ida-artifacts
  IDA_ARTIFACT_BACKEND: s3
  IDA_MODELS_FILE: /app/models.yaml
  IDA_TASKS_DIR: /app/tasks
  IDA_LOG_LEVEL: INFO
  IDA_AUTH_MODE: disabled

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ida
      POSTGRES_PASSWORD: ida
      POSTGRES_DB: ida
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ida -d ida"]
      interval: 2s
      timeout: 3s
      retries: 30

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30

  minio:
    image: minio/minio:RELEASE.2024-10-13T13-34-11Z
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 3s
      timeout: 5s
      retries: 30

  mock-model:
    <<: *python-image
    command:
      ["uvicorn", "ida_mock_model.app:app", "--host", "0.0.0.0", "--port", "8000"]
    environment:
      MOCK_MODEL_ID: mock-echo-1
      MOCK_LATENCY_MS: "25"   # a little latency so timings in the UI are non-zero
      MOCK_FAIL_EVERY: "0"    # set to e.g. 5 to exercise the retry path
    ports:
      - "${MOCK_MODEL_PORT:-8100}:8000"
    healthcheck:
      test:
        ["CMD", "python", "-c",
         "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health').status==200 else 1)"]
      interval: 3s
      timeout: 5s
      retries: 20

  # One-shot: waits for Postgres, creates the schema, creates the MinIO bucket.
  # Everything downstream waits for this to exit 0.
  bootstrap:
    <<: *python-image
    command: ["python", "/app/scripts/bootstrap.py"]
    environment: *python-env
    volumes:
      - ./scripts:/app/scripts:ro
    depends_on:
      postgres: {condition: service_healthy}
      minio: {condition: service_healthy}
    restart: "no"

  api:
    <<: *python-image
    command:
      ["uvicorn", "ida_api.main:app", "--host", "0.0.0.0", "--port", "8000"]
    environment: *python-env
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      bootstrap: {condition: service_completed_successfully}
      redis: {condition: service_healthy}
      mock-model: {condition: service_healthy}
    healthcheck:
      test:
        ["CMD", "python", "-c",
         "import urllib.request,json,sys; b=json.load(urllib.request.urlopen('http://localhost:8000/health')); sys.exit(0 if b['status']=='ok' else 1)"]
      interval: 3s
      timeout: 5s
      retries: 20

  runner:
    <<: *python-image
    command: ["python", "-m", "ida_runner.main"]
    environment: *python-env
    depends_on:
      bootstrap: {condition: service_completed_successfully}
      redis: {condition: service_healthy}
      mock-model: {condition: service_healthy}
    # Scale with: docker compose up -d --scale runner=3
    # BLPOP gives fair work-stealing across replicas for free.

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # Baked at build time: Next.js inlines NEXT_PUBLIC_* into the client bundle.
        NEXT_PUBLIC_API_BASE_URL: http://localhost:${API_PORT:-8000}
    environment:
      # Server-side (RSC) calls go over the compose network, not via localhost.
      API_BASE_URL: http://api:8000
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    depends_on:
      api: {condition: service_healthy}

volumes:
  postgres-data:
  minio-data:
