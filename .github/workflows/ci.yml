# ci.yml — PULL REQUESTS ONLY. Pushes to main and vX.Y.Z tags are handled by
# build-and-push.yaml, whose `checks` jobs run this same suite as the gate in
# front of the image build; triggering here on push too would run everything
# twice for every merge.
#
# SIX independent gates, deliberately parallel so one slow leg does not hide the
# others' results:
#
#   python        ruff + pytest over packages/ and services/, then the
#                 in-process tracer bullet
#   frontend      lint + typecheck + build
#   agile         the sprint board's own suite (see that job)
#   task-schema   schema-validate tasks/** and models.yaml, BOTH layers (a
#                 malformed rubric fails the PR, not a benchmark run three
#                 hours in)
#   migrations    alembic upgrade head against a THROWAWAY Postgres, then
#                 downgrade back -- catches a migration that only works forward
#   chart         render all four overlays and assert the deploy invariants
#
# ── NO REAL MODEL IS EVER CALLED HERE ────────────────────────────────────────
# CI gets MOCK KEYS ONLY. MOCK_MODEL_BASE_URL points at the in-repo stub and the
# provider key variables are set to obviously-fake literals, so a test that
# accidentally reaches for a live provider fails with an auth error instead of
# quietly spending money. No pull request can burn credits or touch campus
# hardware -- that is a property of this file AND of the preview overlay, not of
# anyone remembering.
#
# RUNNER: the per-team ARC scale set created by the CapstoneTenant Composition
# (the Helm releaseName IS the runs-on label). Falls back to the org-wide pool.
#
# CONTAINER-MODE REQUIREMENT: the ARC scale set is containerMode:kubernetes --
# every job MUST declare a `container:` or the runner hard-fails at "Set up job"
# ("Jobs without a job container are forbidden on this runner").
name: ci

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    runs-on: ${{ vars.RUNNER_SCALE_SET || 'ida-llm-kaniko' }}
    container:
      image: harbor.capstone.uamishub.com/dockerhub-proxy/library/python:3.12-slim-bookworm
    env:
      # Obviously-fake. A test that reaches a real provider fails on auth rather
      # than succeeding and billing someone.
      ANTHROPIC_API_KEY: ci-mock-not-a-real-key
      OPENAI_API_KEY: ci-mock-not-a-real-key
      SPARKS_API_KEY: ci-mock-not-a-real-key
      MOCK_MODEL_BASE_URL: http://127.0.0.1:8099
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Install the workspace (editable) + dev tooling
        run: |
          set -eu
          python -m pip install --upgrade pip
          # Same FIVE distributions, same order, as Dockerfile.python -- so a
          # dependency problem surfaces here rather than at image build.
          pip install -e packages/core -e packages/harness -e services/api -e services/runner \
                      -e services/mock-model
          pip install -r requirements-dev.txt

      - name: Lint (ruff)
        run: ruff check packages services tools

      - name: Format check (ruff)
        run: ruff format --check packages services tools

      - name: Test (pytest)
        run: pytest

      - name: E2E tracer bullet (standalone, in process, no Docker)
        # The tracer drives the api, the queue, the runner and the harness end to
        # end in ONE process -- no containers, so it runs in this Docker-less job
        # -- with the same assertions the compose-mode tracer makes against the
        # real stack. `test_tracer_compose.py` self-skips when no API answers,
        # which is why running the whole directory is safe here.
        #
        # ⚠ YES, `pytest` ABOVE ALREADY RAN THIS (e2e is in testpaths), AND THAT
        # IS THE POINT -- but not for the reason you might assume. `cd e2e` does
        # NOT give the suite its own rootdir: pytest walks up, finds the root
        # pyproject.toml, and rootdir stays the repo root (test ids still print
        # as `e2e/test_...`, and the root `addopts` still apply).
        #
        # What it DOES change is WHICH SIBLING CONFTESTS GET LOADED. A root run
        # collects five conftest.py files (core, harness, api, runner, e2e); this
        # run collects one. That is exactly the axis the bug this guards against
        # lives on -- `from conftest import ...` binds to whichever conftest
        # loaded first -- and this repo has already had that bug. Two seconds for
        # a standing check on a failure mode we have actually hit.
        run: cd e2e && python -m pytest .

  frontend:
    runs-on: ${{ vars.RUNNER_SCALE_SET || 'ida-llm-kaniko' }}
    container:
      # ⚠ 24.16 PINNED. Node 24.17 shipped a keepAlive regression that broke
      # in-cluster loopback HTTP on this platform. Keep this in lockstep with
      # frontend/Dockerfile's NODE_IMAGE.
      image: harbor.capstone.uamishub.com/dockerhub-proxy/library/node:24.16-trixie-slim
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Install
        # `npm ci` when a lockfile exists (reproducible); `npm install` on the
        # very first push, before one has been committed. Remove the fallback
        # once package-lock.json is in git -- an unlocked install in CI is a
        # different dependency tree than the image builds.
        run: |
          set -eu
          if [ -f package-lock.json ]; then npm ci --no-audit --no-fund
          else echo "::warning::no package-lock.json yet -- using npm install"; npm install --no-audit --no-fund; fi

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

  agile:
    # The sprint board (apps/agile) has its own test suite and, until this job
    # existed, NOTHING ran it — the component is built and shipped by
    # build-and-push.yaml, but no workflow ever executed its 280 assertions. A
    # test suite that never runs in CI is documentation, not a gate.
    runs-on: ${{ vars.RUNNER_SCALE_SET || 'ida-llm-kaniko' }}
    container:
      # Same 24.16 pin and the same reason as `frontend` above.
      image: harbor.capstone.uamishub.com/dockerhub-proxy/library/node:24.16-trixie-slim
    defaults:
      run:
        working-directory: apps/agile
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Install
        run: npm ci --no-audit --no-fund

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        # No DATABASE_URL on purpose: the db-integration suites detect its
        # absence and skip, so this job needs no Postgres service. Everything
        # that does not touch a database — including the whole GitHub credential
        # seam — runs here.
        run: npm test

      - name: Build
        # `next build` evaluates the config module, so the REQUIRED vars must be
        # present. These are throwaway values that never leave the runner; the
        # build only needs them to be well-formed.
        env:
          DATABASE_URL: postgres://agile:ci-throwaway@127.0.0.1:5432/agile
          SESSION_SECRET: ci-throwaway-session-secret-at-least-32-chars
          APP_URL: http://localhost:3000
          OIDC_CLIENT_ID: ida-agile
        run: npm run build

  task-schema:
    # THE data gate. tasks/** and models.yaml are versioned DATA: every benchmark
    # result cites the git SHA of the task that produced it, and that citation is
    # worthless if the file was malformed. Cheap, fast, and it fails the PR.
    runs-on: ${{ vars.RUNNER_SCALE_SET || 'ida-llm-kaniko' }}
    container:
      image: harbor.capstone.uamishub.com/dockerhub-proxy/library/python:3.12-slim-bookworm
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Install ida-core (the JSON Schemas + the pydantic contracts)
        # Bare PyYAML is no longer enough: the validator now checks BOTH layers
        # -- the JSON Schema in packages/core/ida_core/schemas/ and then the
        # pydantic contract -- because a document can be schema-valid and still
        # violate a rule the schema cannot express (a verifiable task with no
        # gold answers, a duplicate task id).
        run: pip install --upgrade pip && pip install -e packages/core

      - name: Validate tasks/** and models.yaml
        run: python tools/validate_tasks.py

      - name: Check the JSON Schemas are themselves valid
        # THE GATE'S OWN GATE. Everything above trusts these two files to say
        # what a task and a model are. A malformed schema does not fail loudly --
        # jsonschema happily validates against a broken document and reports
        # everything as fine, so the whole task-schema job goes green while
        # checking nothing. That is the single worst failure mode a gate can
        # have, and it costs one second to rule out.
        run: |
          python - <<'PY'
          import json, pathlib, sys
          import jsonschema

          schemas = sorted(pathlib.Path("packages/core/ida_core/schemas").glob("*.json"))
          assert schemas, "no schemas found -- the gate would pass vacuously"

          failures = 0
          for path in schemas:
              try:
                  jsonschema.Draft202012Validator.check_schema(json.loads(path.read_text()))
                  print(f"  ok  {path}")
              except (jsonschema.SchemaError, json.JSONDecodeError) as exc:
                  print(f"FAIL  {path}: {exc}", file=sys.stderr)
                  failures += 1
          sys.exit(failures)
          PY

  migrations:
    # Alembic against a THROWAWAY Postgres 17 -- the same major version the
    # platform's tenant DB tier runs, so a dialect incompatibility is caught here
    # instead of at first ArgoCD sync.
    runs-on: ${{ vars.RUNNER_SCALE_SET || 'ida-llm-kaniko' }}
    container:
      image: harbor.capstone.uamishub.com/dockerhub-proxy/library/python:3.12-slim-bookworm
    services:
      postgres:
        image: harbor.capstone.uamishub.com/dockerhub-proxy/library/postgres:17-alpine
        env:
          POSTGRES_USER: ida
          POSTGRES_PASSWORD: ci-throwaway
          POSTGRES_DB: ida_llm_ci
        options: >-
          --health-cmd "pg_isready -U ida"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      # ⚠ 127.0.0.1, NOT the service label `postgres`. On GitHub-hosted runners a
      # `services:` container is a sibling on a Docker network, reachable by its
      # label as a hostname. Under ARC `containerMode: kubernetes` it is instead an
      # ADDITIONAL CONTAINER IN THE SAME POD, so it shares the pod's network
      # namespace and is reachable on loopback — the label resolves to nothing and
      # psycopg fails with `[Errno -2] Name or service not known`.
      # Confirmed the hard way on this repo's first CI run (job 97647097184), and
      # it matches what the other tenant on this platform actually uses (whose
      # comment says "sibling" while its env says 127.0.0.1 — the env is right).
      DATABASE_URL: postgresql://ida:ci-throwaway@127.0.0.1:5432/ida_llm_ci
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Install
        run: |
          set -eu
          python -m pip install --upgrade pip
          pip install -e packages/core
          pip install alembic==1.16.5 "psycopg[binary]==3.2.10"

      - name: Upgrade to head
        run: alembic upgrade head

      - name: Verify the schema is actually there
        run: |
          set -eu
          python - <<'PY'
          import os
          import psycopg
          with psycopg.connect(os.environ["DATABASE_URL"]) as conn:
              rows = conn.execute(
                  "SELECT table_name FROM information_schema.tables WHERE table_schema='public'"
              ).fetchall()
          names = {r[0] for r in rows}
          missing = {"runs", "results"} - names
          assert not missing, f"missing tables after upgrade: {missing} (present: {names})"
          print("schema OK:", sorted(names))
          PY

      - name: Downgrade to base, then back up
        # A migration that only works FORWARD is a migration you cannot roll back
        # at 2am. Exercising the round trip in CI is the cheapest possible time to
        # find out.
        run: |
          set -eu
          alembic downgrade base
          alembic upgrade head

  chart:
    # Renders all four overlays and asserts the deploy invariants a JSON6902
    # patch can silently break -- pod budget vs quota WITH rollout surge, TLS
    # hosts matching rule hosts, and the mock-model safety switch being ON in
    # dev/preview and OFF in staging/prod.
    runs-on: ${{ vars.RUNNER_SCALE_SET || 'ida-llm-kaniko' }}
    container:
      image: harbor.capstone.uamishub.com/dockerhub-proxy/library/python:3.12-slim-bookworm
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Install kubectl (for `kubectl kustomize`) + PyYAML
        # ⚠ NO apt-get. These runners have external egress on :443 ONLY, and
        # Debian's apt mirrors are dialled over http://deb.debian.org:80 — so
        # `apt-get install curl` does not fail fast, it warns four times about an
        # unreachable network, continues with an empty package list, and exits
        # 100. (Same trap that bit Dockerfile.python; this job had it too.)
        #
        # Python is already in this image and its urllib speaks HTTPS, so it is
        # the fetch tool: no package manager, no extra image, no :80.
        run: |
          set -eu
          python - <<'PY'
          import urllib.request, os, stat
          version = "v1.31.1"
          url = f"https://dl.k8s.io/release/{version}/bin/linux/amd64/kubectl"
          dest = "/usr/local/bin/kubectl"
          urllib.request.urlretrieve(url, dest)
          os.chmod(dest, os.stat(dest).st_mode | stat.S_IEXEC | stat.S_IXGRP | stat.S_IXOTH)
          print("installed kubectl", version)
          PY
          kubectl version --client
          pip install --upgrade pip && pip install pyyaml==6.0.2

      - name: Render every overlay and assert the invariants
        run: bash .devops/ci/chart-render.test.sh

      - name: Unit-test the CI seam scripts
        run: |
          set -eu
          for suite in resolve-image resolve-components bump-image promote seed-initial-envs; do
            echo "::group::${suite}"
            bash ".devops/ci/${suite}.test.sh"
            echo "::endgroup::"
          done
