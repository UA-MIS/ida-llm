# promote-to-prod — THE production gate.
#
# A human clicking "Run workflow" IS the approval. This workflow reads the image
# tag CURRENTLY LIVE in <from>'s overlay and writes that SAME tag into prod's
# overlay. No rebuild. No new git tag. No code edit. The bytes that ran in staging
# are the bytes that run in prod.
#
# Both components move together: promote.sh refuses outright if <from>'s overlay
# entries disagree on a tag, so a half-bumped or hand-edited source can never be
# promoted into an inconsistent prod.
#
# ── `to` IS NOT AN INPUT. IT IS ALWAYS prod (platform-infra #531). ───────────
# An earlier shape let a human promote INTO staging, which conflated "deploy to
# staging" with "prod candidate" and made prod's desired state effectively
# "whatever tag was pushed last". Staging is now reached ONLY by cutting a
# `vX.Y.Z` tag; this button exists for one transition.
#
# `from: [dev, staging]` stays. staging -> prod is the normal path. dev -> prod is
# a deliberate emergency hatch: it skips the tag and staging rungs, so the tag it
# leaves in prod's overlay is a raw git-describe string rather than a semver —
# which is what makes an emergency promotion visually obvious when reading prod's
# overlay history later.
#
# Why prod's ArgoCD gate is `auto` and not `manual`: the human checkpoint moved
# HERE. The git commit this workflow makes IS the approved state, so ArgoCD is a
# pure executor of it — prod sits Synced/green normally and is OutOfSync only for
# the brief window between this commit and the next reconcile.
name: promote-to-prod

on:
  workflow_dispatch:
    inputs:
      from:
        description: "Promote FROM this environment (whatever tag is live there)"
        required: true
        type: choice
        default: staging
        options:
          - staging
          - dev

permissions:
  contents: write

concurrency:
  group: promote-prod
  cancel-in-progress: false     # never cancel a promotion mid-flight

jobs:
  promote:
    runs-on: ${{ vars.RUNNER_SCALE_SET || 'ida-llm-kaniko' }}
    # FULL node image, NOT -slim: this job git-commits and pushes, and -slim ships
    # no git (`git: not found`, exit 127 — live-confirmed on this platform).
    container:
      image: harbor.capstone.uamishub.com/dockerhub-proxy/library/node:24.16-trixie
    env:
      GIT_AUTHOR_NAME: ua-mis-ci
      GIT_AUTHOR_EMAIL: ci@capstone.uamishub.com
      GIT_COMMITTER_NAME: ua-mis-ci
      GIT_COMMITTER_EMAIL: ci@capstone.uamishub.com
      # WHERE THE REGISTRY CREDENTIAL LIVES. Same path build-and-push.yaml uses
      # (its DOCKER_CONFIG_DIR): the `harbor-push` k8s Secret that the ARC
      # runner's container hook mounts into every pod on this scale set. promote.sh
      # reads `${DOCKER_CONFIG}/config.json`, so naming it here is what lets the
      # tag-existence check authenticate — see the step below for the full story.
      DOCKER_CONFIG: /kaniko/.docker
    steps:
      - name: Checkout main
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true

      # ── THE GUARD NEEDS A CREDENTIAL, OR IT IS NOT A GUARD ──────────────────
      #
      # promote.sh refuses to write prod's overlay unless it can CONFIRM every
      # component's tag exists in Harbor (AB#34 — `ida-llm-agile:be4e3d9` was
      # promoted into prod having never been built, and prod came up
      # ImagePullBackOff). That check is deliberately fail-CLOSED: "I could not
      # reach the registry" and "I have no credential for a private project" both
      # render as INCONCLUSIVE, which is a refusal, not a pass.
      #
      # ⚠ SO A MISSING CREDENTIAL DOES NOT WEAKEN THE GUARD — IT BLOCKS EVERY
      # PROMOTION. harbor.capstone.uamishub.com answers an anonymous manifest GET
      # with a 401 Bearer challenge, so without a credential to exchange at the
      # token realm the check reads every real image as inconclusive and refuses.
      # This job shipped with no registry credential at all, so the first promote
      # after AB#34 landed would have failed with a registry error rather than a
      # bad-tag error. This step is the other half of that wiring.
      #
      # TWO SOURCES, EXPLICIT WINS:
      #
      #   1. HARBOR_USERNAME / HARBOR_PASSWORD repository secrets, if an operator
      #      has provisioned a read-only robot. Preferred: least privilege, and it
      #      does not depend on the platform's mount layout.
      #   2. Otherwise the `harbor-push` robot the runner already mounts at
      #      /kaniko/.docker/config.json — the SAME credential build-and-push.yaml
      #      authenticates Kaniko with, on the SAME scale set. Nothing new is
      #      granted to this job that the build job did not already hold, and
      #      promote.sh only ever issues GETs with it.
      #
      # ⚠ OPERATOR CONFIRM (do not assume this is settled):
      #   (a) The `harbor-push` robot must have `pull` on the ida-llm project.
      #       Harbor's push permission does NOT imply pull, and the robot is
      #       provisioned by the PLATFORM's CapstoneTenant chain, not by anything
      #       in this repo — so it cannot be verified from here. If the first
      #       promote after this lands fails with "inconclusive" on every
      #       component, that is the answer: set the two secrets in (1) to a robot
      #       with pull, and re-run.
      #   (b) The mount is asynchronous on a fresh tenant (build-and-push polls it
      #       for five minutes). This job polls briefly and then fails LOUDLY with
      #       the sentence an operator needs, rather than proceeding into a
      #       confusing refusal deep inside promote.sh.
      #
      # ALLOW_UNVERIFIED_PROMOTE=1 remains promote.sh's documented escape hatch
      # for an operator who has confirmed the images another way. It is
      # deliberately NOT set here: an emergency override that is always on is not
      # an override.
      - name: Locate the Harbor read credential the tag check needs
        env:
          HARBOR_USERNAME: ${{ secrets.HARBOR_USERNAME }}
          HARBOR_PASSWORD: ${{ secrets.HARBOR_PASSWORD }}
        run: |
          set -eu
          if [ -n "${HARBOR_USERNAME:-}" ] && [ -n "${HARBOR_PASSWORD:-}" ]; then
            echo "harbor credential: explicit HARBOR_USERNAME/HARBOR_PASSWORD secrets"
            echo "HARBOR_CREDENTIAL_SOURCE=secrets" >> "$GITHUB_ENV"
            exit 0
          fi
          for i in 1 2 3 4 5 6; do
            if [ -s "${DOCKER_CONFIG}/config.json" ]; then
              echo "harbor credential: the runner's robot at ${DOCKER_CONFIG}/config.json"
              echo "HARBOR_CREDENTIAL_SOURCE=runner-docker-config" >> "$GITHUB_ENV"
              exit 0
            fi
            echo "waiting for ${DOCKER_CONFIG}/config.json ($i/6)..."; sleep 5
          done
          echo "::error::No Harbor read credential. promote.sh's tag-existence check (AB#34) fails CLOSED, so this promotion would be refused with a registry error rather than a real verdict. Fix ONE of: (1) set the HARBOR_USERNAME/HARBOR_PASSWORD repository secrets to a Harbor robot with 'pull' on the ida-llm project; or (2) confirm the runner scale set still mounts the harbor-push robot at ${DOCKER_CONFIG}/config.json (build-and-push.yaml depends on the same mount). ALLOW_UNVERIFIED_PROMOTE=1 skips the check entirely and is for an operator who has verified the images another way."
          exit 1

      - name: Promote — read ${{ inputs.from }}'s live tag, write it to prod, commit
        # `bash`, NOT `sh`. promote.sh declares `#!/usr/bin/env bash` and uses
        # `set -euo pipefail`; /bin/sh on this Debian image is dash, which rejects
        # `-o pipefail` and exits 2 before doing any work. Calling the interpreter
        # the script actually declares makes it behave identically everywhere.
        env:
          # Forwarded so promote.sh's `basic_auth_for` prefers the explicit robot
          # over the runner's config.json. Empty when the secrets are unset, which
          # is the documented "fall through to DOCKER_CONFIG" case, not an error.
          HARBOR_USERNAME: ${{ secrets.HARBOR_USERNAME }}
          HARBOR_PASSWORD: ${{ secrets.HARBOR_PASSWORD }}
        run: |
          set -eu
          echo "registry credential source: ${HARBOR_CREDENTIAL_SOURCE}"
          COMMIT=1 bash .devops/ci/promote.sh "${{ inputs.from }}" prod
          git push origin HEAD:main

      - name: Summary
        run: |
          set -eu
          TAG="$(grep -m1 -E '^[[:space:]]*newTag:' .devops/chart/overlays/prod/kustomization.yaml \
                 | sed -E 's/^[[:space:]]*newTag:[[:space:]]*//; s/^"(.*)"$/\1/')"
          {
            echo "### Promoted \`${{ inputs.from }}\` → \`prod\`"
            echo ""
            echo "Both components now pinned at \`${TAG}\` in prod."
            echo "No image was rebuilt — this is the same artifact that ran in ${{ inputs.from }}."
            echo ""
            echo "ArgoCD will reconcile \`ida-llm-prod\` on its next sync."
          } >> "$GITHUB_STEP_SUMMARY"
