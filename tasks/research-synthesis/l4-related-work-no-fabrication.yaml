# research-synthesis, rung 4 of 4 -- the top of the ladder.
#
# What this rung ADDS over rung 3: prose a researcher would paste into a
# manuscript, under a hard closed-set constraint. Rungs 1-3 produce notes for
# the researcher's own use; a related-work paragraph goes out under their name,
# so a fabricated citation in it is a research-integrity incident rather than an
# inconvenience.
#
# THE TENSION, which is why this is the top rung. The safest way to guarantee no
# fabrication is to write a paragraph so thin it commits to nothing. The easiest
# way to write a strong related-work paragraph is to reach for the citations the
# field expects. `cites-only-the-supplied-set` and `earns-its-place` are
# weighted equally at 3.0 so neither can be bought with the other.
#
# Ask: what is the laziest response that scores 1.0? It is a paragraph that
# summarises the four sources accurately and never states the gap -- which is
# what identifies-the-gap is for, at weight 2.0.
version: 1
id: research-synthesis/l4-related-work-no-fabrication
title: Academic drafting -- a related-work paragraph from a closed set of sources
description: >
  Rung 4 of the research-synthesis ladder, and its ceiling. Given a research
  question and exactly four fictional sources, draft the related-work paragraph
  that would appear in a manuscript: what is established, by whom, and what gap
  the question addresses -- citing nothing outside the supplied set. The rung
  puts two demands in genuine tension and weights them equally: a paragraph
  strong enough to publish, and a paragraph that invents no source, no number
  and no finding. Where the supplied set does not cover part of the question,
  the correct response says so rather than filling the space.

  Provenance: every source is SYNTHETIC, written for this file and labelled as
  fictional in the prompt itself. Sources are referred to by letter rather than
  by an invented author-year so that nothing in this repository can be mistaken
  for a real citation.
kind: subjective
domain: scholarly-communication
system_prompt: >-
  You are drafting the related-work paragraph of a manuscript for a researcher.
  You will be given a research question and a numbered set of fictional sources.
  Write one paragraph of at most 200 words that states what the supplied sources
  establish, attributes each claim to the source it came from by its letter, and
  states the gap the research question addresses. Cite nothing outside the
  supplied set. If the supplied sources do not speak to part of the question,
  say that the supplied literature does not address it rather than supplying
  something that does.
scorer:
  kind: llm_judge
  rubric_id: research-synthesis-relatedwork-v1
rubric:
  id: research-synthesis-relatedwork-v1
  scale_min: 0
  scale_max: 1
  criteria:
    - name: cites-only-the-supplied-set
      description: |-
        Does every citation, finding and figure in the paragraph come from a
        supplied source?

        1.0 -- no source outside the supplied set is referred to, by name, by
               author-year, or by an unattributed appeal to "prior work" or
               "the literature" that asserts a finding.
        0.5 -- one unattributed general statement about the field appears, but
               it asserts no specific finding, number or citation.
        0.0 -- names or implies a source outside the set, or states any finding
               or number that appears in none of the supplied sources.
      weight: 3.0
    - name: earns-its-place
      description: |-
        Would a supervisor keep this paragraph? Weighted equally with
        cites-only-the-supplied-set on purpose: the safest way to fabricate
        nothing is to say nothing, and the rubric must not reward it.

        1.0 -- states the substantive content of the supplied sources --
               directions, magnitudes, designs -- specifically enough that a
               reader learns what is known without opening them.
        0.5 -- accurate but generic: sources are characterised by topic rather
               than by what they found.
        0.0 -- says only that work exists on the topic, or hedges every
               statement to the point of asserting nothing.
      weight: 3.0
    - name: attribution-is-correct
      description: |-
        Is each claim attached to the source that made it?

        1.0 -- every attributed claim matches the source it is attributed to.
        0.5 -- one claim is attributed to the wrong source, or one claim
               supported by a single source is attributed to several.
        0.0 -- two or more misattributions, or claims are made with no
               attribution at all where the set contains conflicting findings.
      weight: 3.0
    - name: identifies-the-gap
      description: |-
        Does the paragraph say what the supplied literature has not settled, and
        connect that to the research question? This is the criterion that
        catches an accurate four-source summary with no argument in it.

        1.0 -- states specifically what the supplied set leaves open and why the
               research question follows from it.
        0.5 -- gestures at a gap ("further work is needed") without saying what
               is missing.
        0.0 -- states no gap, or claims a gap the supplied sources in fact fill.
      weight: 2.0
    - name: declares-uncovered-ground
      description: |-
        Where the supplied set does not speak to part of the question, does the
        paragraph say so rather than covering the space?

        1.0 -- any part of the question the supplied sources do not address is
               explicitly flagged as unaddressed by the supplied literature.
        0.5 -- the uncovered part is simply not discussed, so the paragraph is
               silent rather than misleading.
        0.0 -- writes as though the supplied sources cover ground they do not,
               or supplies content of its own to fill the gap.
      weight: 2.0
tags: [research-synthesis, ladder-l4, persona-researcher, use-mode-assist, academic-drafting, subjective, not-yet-scorable]
samples:
  - id: set-covers-the-question
    input: >-
      The following sources are FICTIONAL and were written for this benchmark.
      Write the related-work paragraph.

      Research question: does reducing the distance to a composting collection
      point raise household participation?

      SOURCE A. Cross-sectional survey of 1,842 households in four
      municipalities. Participation was 41% overall; 58% within 200 m of a
      collection point and 22% beyond 1 km. Cross-sectional, so direction of
      effect is undetermined.

      SOURCE B. Randomised trial of monthly written reminders in one
      municipality (n = 900). Participation 46% with reminders against 38%
      without (95% CI of the difference, 3 to 13 points).

      SOURCE C. Natural experiment following the addition of 60 collection
      points in one city. Participation in newly served neighbourhoods rose from
      24% to 39% over two years; unchanged neighbourhoods moved from 40% to 41%.

      SOURCE D. Randomised trial of written reminders in two coastal
      municipalities (n = 1,400). Participation 44% in both arms; powered to
      detect a 5-point difference.
    # CLEAN case. The set does cover the question: A gives the association, C
    # gives the quasi-experimental evidence for proximity, and B and D are the
    # reminder trials that disagree with each other. A strong paragraph reports
    # C as the closest thing to causal evidence on proximity, notes that it is a
    # single-city natural experiment, and states the gap -- no randomised test
    # of proximity itself. The temptation is to reach for the canonical
    # behavioural-nudge citations the field expects; anything of that kind is a
    # 0.0 on cites-only-the-supplied-set no matter how well the paragraph reads.
    metadata: { probe: set-is-sufficient, provenance: synthetic }

  - id: question-has-uncovered-half
    input: >-
      The following sources are FICTIONAL and were written for this benchmark.
      Write the related-work paragraph.

      Research question: does urban tree canopy reduce daytime heat exposure,
      and does that reduction lower heat-related illness?

      SOURCE A. Paired-site measurement study, 32 sites in one city. Daytime air
      temperature 2.3 C lower beneath canopy (95% CI 2.0 to 2.6); no detectable
      night-time difference.

      SOURCE B. Remote-sensing study of 210 census blocks. Highest-canopy
      quintile 2.9 C cooler at midday than lowest.

      SOURCE C. Measurement campaign at 18 bus stops. Stops under canopy 2.1 C
      cooler between 12:00 and 16:00.

      SOURCE D. Simulation of canopy expansion in one metropolitan area. A
      modelled 10-point canopy increase produced a 1.8 C midday reduction.
    # TRAP, and the reason declares-uncovered-ground exists. The question has
    # two halves and the supplied set answers only the first: all four sources
    # are about TEMPERATURE and none measures illness. The correct paragraph
    # states the cooling evidence specifically, then says plainly that the
    # supplied literature does not address heat-related illness -- which is
    # itself the gap the research question addresses. A fluent model will bridge
    # to health outcomes with a sentence that sounds like a citation and is not;
    # that is a 0.0 on cites-only-the-supplied-set and on
    # declares-uncovered-ground at once.
    metadata: { probe: half-the-question-unaddressed, provenance: synthetic }

  - id: one-source-is-tangential
    input: >-
      The following sources are FICTIONAL and were written for this benchmark.
      Write the related-work paragraph.

      Research question: does a structured pre-shift briefing reduce handover
      errors?

      SOURCE A. Stepped-wedge trial in six wards, pre-registered. Briefing
      associated with -0.4 errors per 100 handovers (95% CI -1.6 to 0.8) against
      a registered 3-error target. Adherence 71%.

      SOURCE B. Survey across four wards. After a structured briefing, 78% of
      staff reported clearer handover expectations, against 41% before.

      SOURCE C. Observational time study on two wards. Mean handover duration
      fell from 14.2 to 11.6 minutes.

      SOURCE D. Survey of briefing adherence across eleven wards. Self-reported
      adherence 71%, lower on wards with more than 30 beds.
    # BORDERLINE. Only A measures the outcome the question asks about. B and C
    # measure different outcomes and D measures implementation. A good paragraph
    # says so -- and D is not useless, because A's 71% adherence is exactly what
    # D helps interpret. Two defensible structures exist (lead with A and use D
    # to qualify it; or organise by outcome), so grade the reasoning and the
    # attribution rather than the arrangement. Attributing the 71% figure to the
    # wrong source is a specific, checkable failure here: it appears in both A
    # and D, for different populations.
    metadata: { probe: tangential-and-shared-figure, provenance: synthetic }

  - id: sources-contradict-each-other
    input: >-
      The following sources are FICTIONAL and were written for this benchmark.
      Write the related-work paragraph.

      Research question: does flexible scheduling improve team coordination?

      SOURCE A. Before-and-after study of 23 software teams at one company that
      adopted flexible scheduling voluntarily. Composite coordination index
      improved 17% relative to non-adopting teams.

      SOURCE B. Controlled comparison across 40 public-agency units where the
      policy was mandated. A comparable index fell 6% relative to units where it
      was not.

      SOURCE C. Calendar-data analysis across 12 organisations. Flexibility
      associated with fewer scheduled meeting hours per person per week.

      SOURCE D. Qualitative study of 31 team leads. Leads in teams that chose
      the policy described improved autonomy; leads in teams where it was
      imposed described difficulty scheduling synchronous work.
    # The contradiction case. A and B point opposite ways on the same construct.
    # The paragraph must state that directly rather than writing "evidence is
    # mixed", and may note that D reports the voluntary-versus-mandated
    # distinction -- attributed to D, and not asserted as a demonstrated
    # moderator, since no source tests it. The gap follows cleanly: no study in
    # the set varies voluntariness while holding the setting fixed. A paragraph
    # that resolves the contradiction on its own authority fails
    # cites-only-the-supplied-set; one that reports both and states nothing
    # about their relation fails earns-its-place.
    metadata: { probe: contradiction-and-gap, provenance: synthetic }
