# om300-exam2-project-quality-spc, rung 5 of 5: sequencing and chart reading.
# Skill targets derive from the Exam 2 blueprint. Networks and series are new.
# exact_match on a pinned string / a single letter; case folded, punctuation kept
# (hyphens matter in the path format).
# NOTE ON IMAGES: the source exam shows its control charts as pictures. Pictures
# cannot be sent through this harness, so each chart is described in text as the
# numeric series plotted plus the plotted limits.
version: 1
id: om300-exam2-project-quality-spc/l5-sequencing-and-chart-reading
title: "OM 300 Exam 2 rung 5: critical-path sequences and chart-pattern reading"
kind: verifiable
domain: operations-management
description: >-
  Rung 5 of 5. Two multi-step demands in a pinned format: name the critical
  path as an ordered string, and judge whether a process is in control from
  a described x-bar/R chart pair or from a list of sample means against
  stated limits. Adds, over rung 4, comparing several derived quantities
  (all paths; every point and run) before answering. Provenance: every item
  is synthetic, authored for this file; the skill targets derive from the OM
  300 Exam 2 blueprint (project scheduling and crashing, quality concepts,
  statistical process control). No exam wording, scenario, numbers, options
  or answer key are reproduced, and no student work or textbook content is
  involved.
system_prompt: >-
  You are producing the answer key for an undergraduate operations-management
  quiz. Use the format the item pins exactly. You may reason first, but put
  the final answer alone on the last line, with no other text on that line.
scorer:
  kind: exact_match
  normalisation:
    take_last_line: true
    strip: true
    collapse_whitespace: true
    lowercase: true
tags: [slo-benchmark, "slo:SLO2", "use-mode:capability", om300-exam2-project-quality-spc, om300, ladder-l5, sequencing, chart-reading, multi-step, quantitative-literacy]
samples:
  - id: cp-single-unique
    input: >-
      Activity / duration (days) / immediate predecessors: A / 3 / none; B / 6 /
      A; C / 2 / A; D / 4 / B; E / 5 / C; F / 3 / D,E. Give the critical
      path as the activity letters in order, separated by single hyphens and
      with no spaces (for example X-Y-Z).
    # Paths: A-B-D-F = 3+6+4+3 = 16; A-C-E-F = 3+2+5+3 = 13. Critical path A-B-D-F (16). Wrong: A-C-E-F (13) is the shorter branch; listing every activity, A-B-C-D-E-F, is not a path.
    target: "A-B-D-F"
    metadata: { skill: critical-path-sequence, provenance: synthetic, slo: SLO2, use_mode: capability }

  - id: cp-merge-late
    input: >-
      Activity / duration (days) / immediate predecessors: A / 4 / none; B / 3 /
      A; C / 6 / A; D / 5 / B; E / 2 / C,D. Give the critical path as the
      activity letters in order, separated by single hyphens and with no
      spaces (for example X-Y-Z).
    # Paths: A-B-D-E = 4+3+5+2 = 14; A-C-E = 4+6+2 = 12. Critical A-B-D-E (14). Wrong: A-C-E picks the single biggest activity C.
    target: "A-B-D-E"
    metadata: { skill: critical-path-sequence, provenance: synthetic, slo: SLO2, use_mode: capability }

  - id: cp-two-starts
    input: >-
      Activity / duration (days) / immediate predecessors: A / 6 / none; B / 9 /
      none; C / 7 / A; D / 2 / B; E / 3 / C,D. Give the critical path as the
      activity letters in order, separated by single hyphens and with no
      spaces (for example X-Y-Z).
    # Paths: A-C-E = 6+7+3 = 16; B-D-E = 9+2+3 = 14. Critical A-C-E (16), two days ahead of B-D-E. Wrong: B-D-E picks the biggest first activity B.
    target: "A-C-E"
    metadata: { skill: critical-path-sequence, provenance: synthetic, slo: SLO2, use_mode: capability }

  - id: cp-long-chain
    input: >-
      Activity / duration (days) / immediate predecessors: A / 2 / none; B / 7 /
      A; C / 3 / A; D / 4 / B; E / 9 / C; F / 1 / D,E. Give the critical
      path as the activity letters in order, separated by single hyphens and
      with no spaces (for example X-Y-Z).
    # Paths: A-B-D-F = 2+7+4+1 = 14; A-C-E-F = 2+3+9+1 = 15. Critical A-C-E-F (15). Wrong: A-B-D-F wins on biggest second activity B.
    target: "A-C-E-F"
    metadata: { skill: critical-path-sequence, provenance: synthetic, slo: SLO2, use_mode: capability }

  - id: chart-mean-shift-range-ok
    input: >-
      A packing line is monitored with an x-bar chart and an R chart. X-bar chart:
      centre line 9.0, lower control limit 4.0, upper control limit 14.0;
      the ten plotted sample means are 9.6, 8.7, 9.2, 8.1, 9.9, 3.1, 2.8,
      3.3, 3.0, 2.9. R chart: centre line 3.0, lower control limit 1.0,
      upper control limit 5.0; the ten plotted sample ranges are 3.1, 2.7,
      3.6, 2.9, 3.4, 3.0, 2.2, 3.8, 3.5, 2.6. A point is out of control only
      if it lies outside the limits, and a long run of points on one side of
      the centre line also signals loss of control. Which statement is true?
      Choose one: A) The process is in control. B) The mean is in control
      but the range is not. C) The mean is not in control but the range is.
      D) Neither the mean nor the range is in control. Answer with only the
      letter on the last line.
    # C: means 3.1..3.3 are all below the lower limit 4.0 (points 6-10) -> mean out; ranges 2.2-3.8 all within 1.0-5.0 and scatter on both sides of 3.0 -> range in control. Wrong picks: A ignores the points below 4.0; D wrongly condemns the ranges.
    target: "C"
    metadata: { skill: chart-reading, provenance: synthetic, slo: SLO2, use_mode: capability }

  - id: chart-all-in-control
    input: >-
      A packing line is monitored with an x-bar chart and an R chart. X-bar chart:
      centre line 20.0, lower control limit 14.0, upper control limit 26.0;
      the ten plotted sample means are 21.2, 18.9, 20.5, 19.4, 22.1, 17.8,
      20.3, 19.9, 21.0, 18.6. R chart: centre line 6.0, lower control limit
      0.0, upper control limit 12.0; the ten plotted sample ranges are 5.2,
      7.1, 4.8, 6.3, 6.9, 5.5, 4.4, 7.6, 6.0, 5.8. A point is out of control
      only if it lies outside the limits, and a long run of points on one
      side of the centre line also signals loss of control. Which statement
      is true? Choose one: A) The process is in control. B) The mean is in
      control but the range is not. C) The mean is not in control but the
      range is. D) Neither the mean nor the range is in control. Answer with
      only the letter on the last line.
    # A: every mean lies in 14-26 and they alternate around 20; every range lies in 0-12 and alternates around 6 -> in control. Wrong picks assume a problem that is not there.
    target: "A"
    metadata: { skill: chart-reading, provenance: synthetic, slo: SLO2, use_mode: capability }

  - id: chart-range-spike
    input: >-
      A packing line is monitored with an x-bar chart and an R chart. X-bar chart:
      centre line 50.0, lower control limit 48.0, upper control limit 52.0;
      the ten plotted sample means are 50.4, 49.7, 50.1, 49.2, 50.8, 49.9,
      50.3, 49.6, 50.5, 49.8. R chart: centre line 2.0, lower control limit
      0.5, upper control limit 3.5; the ten plotted sample ranges are 1.8,
      2.2, 1.6, 4.1, 2.4, 1.9, 3.9, 2.0, 2.6, 1.7. A point is out of control
      only if it lies outside the limits, and a long run of points on one
      side of the centre line also signals loss of control. Which statement
      is true? Choose one: A) The process is in control. B) The mean is in
      control but the range is not. C) The mean is not in control but the
      range is. D) Neither the mean nor the range is in control. Answer with
      only the letter on the last line.
    # B: means all within 48-52 and alternate about 50 -> mean in control; ranges 4.1 and 3.9 exceed UCL 3.5 -> range out of control.
    target: "B"
    metadata: { skill: chart-reading, provenance: synthetic, slo: SLO2, use_mode: capability }

  - id: chart-both-out
    input: >-
      A packing line is monitored with an x-bar chart and an R chart. X-bar chart:
      centre line 75.0, lower control limit 70.0, upper control limit 80.0;
      the ten plotted sample means are 76.0, 74.1, 81.4, 75.5, 73.9, 82.2,
      74.8, 76.3, 75.1, 74.4. R chart: centre line 4.0, lower control limit
      1.0, upper control limit 7.0; the ten plotted sample ranges are 4.2,
      3.8, 7.9, 4.4, 3.5, 0.6, 4.1, 3.9, 4.6, 3.7. A point is out of control
      only if it lies outside the limits, and a long run of points on one
      side of the centre line also signals loss of control. Which statement
      is true? Choose one: A) The process is in control. B) The mean is in
      control but the range is not. C) The mean is not in control but the
      range is. D) Neither the mean nor the range is in control. Answer with
      only the letter on the last line.
    # D: means 81.4 and 82.2 exceed UCL 80 -> mean out; range 7.9 > 7 and 0.6 < 1.0 -> range out. Both out.
    target: "D"
    metadata: { skill: chart-reading, provenance: synthetic, slo: SLO2, use_mode: capability }

  - id: verdict-all-inside
    input: >-
      The process mean's x-bar chart has an upper control limit of 52.0 and a
      lower control limit of 46.0. Eleven sample means were observed: 47.1,
      50.8, 51.6, 46.4, 49.9, 48.2, 51.1, 47.9, 50.3, 49.0, 51.8. Is the
      process in control, judging only by whether any sample mean falls
      outside the limits? A) In control B) Out of control C) Not enough
      information. Answer with only the letter on the last line.
    # A: lowest 46.4 > 46.0, highest 51.8 < 52.0; every point is inside -> in control. Trap: points near but inside the limits.
    target: "A"
    metadata: { skill: limit-check, provenance: synthetic, slo: SLO2, use_mode: capability }

  - id: verdict-one-outside
    input: >-
      The process mean's x-bar chart has an upper control limit of 52.0 and a
      lower control limit of 46.0. Eleven sample means were observed: 47.1,
      50.8, 51.6, 46.4, 49.9, 45.9, 51.1, 47.9, 50.3, 49.0, 51.8. Is the
      process in control, judging only by whether any sample mean falls
      outside the limits? A) In control B) Out of control C) Not enough
      information. Answer with only the letter on the last line.
    # B: the sixth mean 45.9 is below LCL 46.0 -> out of control. Trap: the other ten are inside, and 45.9 is only 0.1 under.
    target: "B"
    metadata: { skill: limit-check, provenance: synthetic, slo: SLO2, use_mode: capability }

  - id: verdict-high-point
    input: >-
      The process mean's x-bar chart has an upper control limit of 30.0 and a
      lower control limit of 24.0. Eleven sample means were observed: 26.2,
      28.8, 25.1, 27.7, 24.3, 29.9, 30.4, 26.6, 27.0, 25.5, 28.1. Is the
      process in control, judging only by whether any sample mean falls
      outside the limits? A) In control B) Out of control C) Not enough
      information. Answer with only the letter on the last line.
    # B: the seventh mean 30.4 exceeds UCL 30.0 -> out of control. 29.9 is inside, so the item turns on 30.4 alone.
    target: "B"
    metadata: { skill: limit-check, provenance: synthetic, slo: SLO2, use_mode: capability }
