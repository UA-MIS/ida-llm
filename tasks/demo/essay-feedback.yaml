# The subjective exemplar.
#
# This task is SCORABLE -- when a judge model is configured. LLM-as-judge is
# implemented (ida_harness/judge.py, docs/llm-judge.md) and deliberately off by
# default: grading costs one judge call per criterion per sample, so it starts
# when an operator sets IDA_JUDGE_MODEL_KEY, not because a feature merged.
#
# With no judge configured the API reports it with `scorable: false` and a
# reason, and the runner records score=null rather than zeros -- and the
# transcripts are archived, so `python -m ida_harness.regrade <run_id>` can
# grade the run afterwards. The `not-yet-scorable` tag below reflects that
# DEFAULT deployment state; it is left untouched deliberately, because tags are
# part of the task's content_sha and editing one would change this task's
# comparability key for a comment-level clarification.
version: 1
id: demo/essay-feedback
title: Undergraduate essay feedback
description: >
  Given a short excerpt from an undergraduate essay, produce formative feedback
  a professor could hand back. Judged against a rubric, not a gold answer --
  there is no single correct response.
kind: subjective
domain: writing
system_prompt: >-
  You are an experienced university writing instructor. Give brief, specific,
  actionable formative feedback on the excerpt. Do not rewrite it for the student.
scorer:
  kind: llm_judge
  rubric_id: essay-feedback-v1
rubric:
  id: essay-feedback-v1
  scale_min: 0
  scale_max: 1
  criteria:
    - name: specificity
      description: >-
        Feedback points at concrete passages in the excerpt rather than offering
        generic advice that would apply to any essay.
      weight: 2.0
    - name: actionability
      description: >-
        The student could act on the feedback in a revision without further
        clarification.
      weight: 2.0
    - name: tone
      description: >-
        Constructive and appropriate for an undergraduate; neither harsh nor
        empty praise.
      weight: 1.0
    - name: restraint
      description: >-
        Does not rewrite the passage for the student or supply the thesis itself.
      weight: 1.0
tags: [tracer, subjective, not-yet-scorable]
samples:
  - id: thesis-vague
    input: >-
      Give formative feedback on this excerpt from a first-year history essay:
      "The industrial revolution was a very important event that changed many
      things about society. There were lots of factories and people moved to
      cities. This essay will talk about some of the effects."
    metadata: { excerpt_kind: introduction }
  - id: evidence-thin
    input: >-
      Give formative feedback on this excerpt from a first-year history essay:
      "Working conditions in factories were bad. Many sources say this. Child
      labour was also a problem during this time period, which was bad too."
    metadata: { excerpt_kind: body-paragraph }
