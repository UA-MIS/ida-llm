# slo3-global-analysis, rung 1 of 4 -- the floor.
#
# SLO 3 (Global Perspective): "students demonstrate knowledge of global factors,
# global systems, & cross-cultural variations and their role in business
# decisions." This family is the SUBJECTIVE half of SLO 3 -- the "role in
# business decisions" clause, which is reasoning and cannot be keyed. The
# verifiable half lives in tasks/slo3-global-knowledge/. SCHEMA.md requires one
# kind per family, so SLO 3 is two directories; the tag `slo:SLO3` is what
# groups them, and a dashboard grouping on tags sees one outcome.
#
# What this rung measures: can the model NAME the global factors that bear on a
# decision, and -- the half that actually discriminates -- can it refrain from
# naming ones that do not? The obvious way to score well on a coverage rubric is
# to list every global factor that exists, so this rubric weights precision
# equally with recall and the sample set includes a scenario where the honest
# list is short.
version: 1
id: slo3-global-analysis/l1-factor-identification
title: Global perspective -- identifying which global factors bear on a decision
description: >
  Rung 1 of the slo3-global-analysis ladder, and its floor. Given a synthetic
  business scenario, identify the global factors that actually bear on the
  decision. The rubric weights precision equally with recall, because a response
  that lists every global factor it can think of would otherwise score highly on
  recall alone; one of the four samples is a decision with very few genuine
  global factors, so an exhaustive lister is caught.

  This is a subjective task. With no judge model configured it will load, run
  and store transcripts, and report no score -- see docs/llm-judge.md.

  Provenance: every firm, country, currency and scenario is synthetic, invented
  for this file. No real company, trade agreement or market is described, no
  student work is used, and no textbook or question-bank content is reproduced.
kind: subjective
domain: international-business
system_prompt: >-
  You are advising the management team of a mid-sized firm. Read the scenario
  and identify the global factors -- factors originating outside the firm's home
  country, or arising from its exposure to other countries and cross-border
  systems -- that bear on the decision described. For each factor, name it and
  say in one sentence which specific part of the decision it touches. List only
  factors this scenario actually raises. If the decision has few genuine global
  factors, say so plainly rather than lengthening the list.
scorer:
  kind: llm_judge
  rubric_id: slo3-global-analysis-identification-v1
rubric:
  id: slo3-global-analysis-identification-v1
  scale_min: 0
  scale_max: 1
  criteria:
    - name: recall-of-operative-factors
      description: |-
        Does the response name the global factors that the scenario actually
        puts in play? Count only factors the scenario supplies facts about --
        an exchange rate that is quoted, a tariff that is mentioned, a supply
        route that is described, a regulatory regime that is named.

        1.0 -- every global factor the scenario supplies facts about is named.
        0.5 -- one such factor is missing, or one is named so vaguely
               ("international issues", "global conditions") that it cannot be
               matched to anything in the scenario.
        0.0 -- two or more are missing, or the response names no factor that
               can be traced to a fact in the scenario.
      weight: 3.0
    - name: precision-against-invented-factors
      description: |-
        Does the response avoid naming global factors the scenario gives no
        basis for? Weighted equally with recall on purpose: the cheapest way to
        score well on recall is to list every global factor that exists, and
        this rubric must not reward it.

        1.0 -- every factor named can be traced to a fact stated in the
               scenario.
        0.5 -- one factor is named that the scenario does not support, and the
               response flags it as a possibility rather than asserting it.
        0.0 -- one factor is asserted as operative with no basis in the
               scenario, or two or more unsupported factors are named.
      weight: 3.0
    - name: touchpoint-is-specific
      description: |-
        For each factor named, does the response say which specific part of the
        decision it touches, rather than restating that the factor exists?

        1.0 -- every factor is tied to a named element of the decision (a cost
               line, a lead time, a price, a site choice, a contract term).
        0.5 -- some factors are tied to a specific element and others are left
               as bare labels.
        0.0 -- factors are listed as labels with no link to the decision, or the
               links given would fit any scenario unchanged.
      weight: 2.0
    - name: calibrated-list-length
      description: |-
        Is the length of the list proportionate to what the scenario contains?
        This criterion exists to catch the response that treats every scenario
        as maximally global.

        1.0 -- the list is proportionate, and where the scenario is thin on
               global content the response says so explicitly.
        0.5 -- the list is padded with one or two marginal factors, but the
               response distinguishes the central ones from the marginal ones.
        0.0 -- the list is padded and undifferentiated, or the response asserts
               that a largely domestic decision is heavily globally exposed.
      weight: 2.0
tags: [slo:SLO3, use_mode:capability, slo3-global-analysis, ladder-l1, international-business, subjective, not-yet-scorable]
samples:
  # CLEAN. The global factors are numerous, explicit and each attached to a
  # stated fact: currency, tariff, freight lead time, and a local-content rule.
  # An adequate response should find all four.
  - id: sourcing-shift-explicit-factors
    input: >-
      Kestrel Foods currently makes its blender housings at its home-country
      plant. It is considering moving that production to a contract
      manufacturer in the Republic of Marenna. The contract would be priced in
      Marenna dinar, and the dinar has moved between 7.10 and 9.40 to the US
      dollar over the past three years. Finished housings imported from Marenna
      attract a 6% ad valorem duty. Ocean freight from Marenna adds eleven weeks
      to the replenishment lead time, against three days from the home plant.
      Marenna's investment code requires that at least 30% of the value of goods
      produced under a contract-manufacturing licence be sourced from Marenna
      suppliers. Should Kestrel move the production?
    # Author's note: four operative factors, each with a supplied fact --
    # exchange-rate volatility (the 7.10-9.40 range), trade policy (the 6%
    # duty), global logistics (eleven weeks vs three days), and a host-country
    # regulatory regime (the 30% local-content rule). A response that finds
    # three of four should lose recall. A response that adds "political
    # instability" or "cultural differences" -- neither of which the scenario
    # supports -- should lose precision, and that is the trade this sample
    # exists to expose.
    metadata: { probe: dense-and-explicit, provenance: synthetic }

  # BORDERLINE. Global factors are present but they are second-order: the
  # decision is mostly about home-market demand. Two verdicts on how much weight
  # to give the global content are defensible; what is being graded is whether
  # the response distinguishes the central factor from the marginal ones.
  - id: capacity-expansion-mostly-domestic
    input: >-
      Kestrel Foods' home-market sales have grown 9% a year for three years and
      its single home-country plant is at 94% of capacity. Management is
      deciding whether to add a second shift or build a second line. Both
      options serve the home market only. The steel used in the product frames
      is bought on a world commodity market and its price has risen 18% over the
      same period. The specialist machine tools for a second line have an
      eighteen-week delivery time from their only manufacturer, which is
      overseas. Which option should Kestrel choose?
    # Author's note: the decision is a domestic capacity question. Two genuine
    # global factors touch it -- world commodity pricing on an input, and a
    # single overseas source for capital equipment with a long lead time -- and
    # neither is central. The graded judgement is proportion: a response that
    # frames this as a fundamentally global decision should lose
    # calibrated-list-length, and so should one that finds no global factor at
    # all, since two are stated.
    metadata: { probe: second-order-factors, provenance: synthetic }

  # TRAP. The scenario is dressed in international surface detail -- a
  # foreign-sounding supplier name, a trade fair abroad, an executive relocating
  # -- none of which bears on the decision. The decision itself turns on a
  # domestic contract term. A response that mines the surface detail for global
  # factors has failed precision.
  - id: international-surface-detail
    input: >-
      Kestrel Foods buys its packaging from Vantario Packaging, a supplier whose
      founder emigrated from Costa Verde and which is incorporated, staffed and
      wholly operated in Kestrel's home country from a single home-country
      plant. Kestrel's purchasing director met Vantario at an industry trade
      fair in Marenna two years ago. Vantario's home-country contract is up for
      renewal; it offers a 4% discount for a three-year exclusive commitment,
      against the one-year rolling terms Kestrel has now, and Kestrel's
      packaging specification is expected to change within eighteen months as it
      moves to a new product size. Should Kestrel sign the three-year exclusive?
    # Author's note: NOTHING here is a global factor. The supplier is domestic
    # in incorporation, staffing and operations; the founder's origin and the
    # location of a trade fair two years ago touch no part of the decision,
    # which turns entirely on contract flexibility against a foreseeable
    # specification change. The honest answer names no operative global factor
    # and says so. This is the sample that catches a model which pattern-matches
    # on foreign proper nouns, and it is the reason precision is weighted at
    # 3.0.
    metadata: { probe: foreign-nouns-no-global-factor, provenance: synthetic }

  # NOTHING-IS-WRONG variant for an identification task: a decision with exactly
  # ONE genuine global factor. The honest list has one item on it. A family
  # whose scenarios are all factor-rich teaches a model to always produce a long
  # list, and a model that always produces a long list is measuring nothing.
  - id: single-genuine-factor
    input: >-
      Kestrel Foods is choosing between two home-country logistics providers for
      its domestic distribution. Both quote in the home currency, both operate
      only within the home country, and their service levels are equivalent.
      Provider A quotes a flat annual fee. Provider B quotes a lower base fee
      plus a fuel surcharge indexed to the world crude oil price, which has
      moved by more than 40% within a single year twice in the past decade.
      Which provider should Kestrel choose?
    # Author's note: exactly one global factor -- exposure to a world commodity
    # price through the indexed surcharge, which converts a domestic logistics
    # contract into a position on crude. Everything else is deliberately
    # domestic and deliberately symmetric between the two providers. A response
    # that names that one factor, ties it to the surcharge clause, and stops
    # scores 1.0. A response that adds exchange-rate risk, tariffs or
    # geopolitical risk -- none of which the scenario supports -- should lose
    # precision, and one that produces a six-item list should lose
    # calibrated-list-length as well.
    metadata: { probe: exactly-one-factor, provenance: synthetic }
