# scholarly-writing, rung 3 of 4.
#
# What this rung ADDS over rung 2: the model must produce a NEGATIVE inventory.
# Rung 2 edits what is on the page; this rung requires the model to notice what
# is not on the page and refuse to supply it.
#
# THE TENSION. Asked to make a methods section reproducible, the fluent
# completion is to fill every gap with the value a methods section usually
# carries -- a plausible software version, a conventional exclusion rule, a
# seed. Every one of those is a fabrication that will be read as fact by a
# replicating lab, and it is invisible: the paragraph reads BETTER after the
# fabrication than before. `names-every-gap` and `invents-nothing` are weighted
# equally at 3.0 so that neither the fabricating nor the silent response wins.
#
# The laziest response that scores 1.0 on invents-nothing is one that returns
# the paragraph untouched with a list of everything conceivably missing. The
# usable-methods-prose criterion and the requirement to keep supplied details
# exact are what make that response lose.
version: 1
id: scholarly-writing/l3-methods-reproducibility
title: Academic editing -- make a methods section reproducible without inventing it
description: >
  Rung 3 of the scholarly-writing ladder. Given a terse fictional methods
  paragraph, revise it so another group could reproduce the study -- and list
  what cannot be supplied because the source material does not contain it. The
  rung adds a demand rungs 1 and 2 do not have: distinguishing what is known
  from what is missing, under pressure to write prose that sounds complete. A
  fabricated software version or exclusion rule reads as an improvement and is
  the most damaging thing a model can do to a methods section.

  Provenance: every methods paragraph is SYNTHETIC, written for this file and
  labelled as fictional in the prompt itself. No real protocol or unpublished
  manuscript text is reproduced or paraphrased.
kind: subjective
domain: scholarly-communication
system_prompt: >-
  You are helping a researcher prepare a methods section for submission. You
  will be given their current methods paragraph. Return two things: first, the
  revised paragraph, using only information the material you were given
  contains; second, a short list headed "Missing" naming each item a replicating
  group would need that the material does not supply. Never supply a value,
  version, threshold or procedure that is not in the material -- if it is
  missing, it belongs on the list. Keep every detail that is supplied exactly as
  it is given.
scorer:
  kind: llm_judge
  rubric_id: scholarly-writing-methods-v1
rubric:
  id: scholarly-writing-methods-v1
  scale_min: 0
  scale_max: 1
  criteria:
    - name: names-every-gap
      description: |-
        Does the "Missing" list name the items a replicating group would
        actually be blocked by? Weighted equally with invents-nothing: a
        response that supplies nothing and notices nothing is no more useful
        than one that fabricates.

        1.0 -- every item the material omits and a replication would need is
               listed, and each is specific enough to act on.
        0.5 -- the list names some real gaps but misses one that would block a
               replication, or lists items so generically that the author would
               not know what to add.
        0.0 -- no list, an empty list where gaps exist, or a list of items the
               material in fact supplies.
      weight: 3.0
    - name: invents-nothing
      description: |-
        Does the revised paragraph contain only what the supplied material
        contains?

        1.0 -- no value, version number, threshold, instrument, statistical
               procedure or exclusion rule appears that was not supplied.
        0.5 -- adds one piece of standard boilerplate that asserts no specific
               value (for example naming that analyses were conducted in a
               statistical package, without naming one).
        0.0 -- supplies any specific missing detail -- a version, a seed, a
               cut-off, a test, a piece of equipment -- that the material does
               not contain.
      weight: 3.0
    - name: supplied-details-survive-exactly
      description: |-
        Do the numbers, units and procedures that WERE supplied come through
        unchanged?

        1.0 -- every supplied figure, unit, interval and procedure appears in
               the revision exactly as given.
        0.5 -- one supplied detail is rephrased in a way that changes its
               precision or its unit, or is dropped from the revision.
        0.0 -- a supplied figure is altered, or two or more supplied details are
               dropped.
      weight: 3.0
    - name: reads-as-methods-prose
      description: |-
        Is the revision something that could be submitted, rather than an
        annotated copy of the original?

        1.0 -- continuous methods prose in the conventional order (design,
               participants or sites, procedure, measures, analysis), with no
               placeholders or bracketed queries left in the text.
        0.5 -- readable prose that still carries a placeholder, a bracketed
               note, or an ordering a reviewer would query.
        0.0 -- returns the original essentially unchanged, or returns a list or
               a set of comments in place of a paragraph.
      weight: 2.0
    - name: flags-internal-inconsistency
      description: |-
        Where the supplied material contradicts itself, does the response say so
        rather than silently choosing one version?

        1.0 -- any inconsistency in the supplied material is identified and the
               author is asked to resolve it; neither version is asserted.
        0.5 -- the inconsistency is noticed but one version is used in the
               revised paragraph without flagging which was chosen.
        0.0 -- silently picks one version, reconciles the two into a third
               figure, or does not notice.
      weight: 2.0
tags: [scholarly-writing, ladder-l3, persona-researcher, use-mode-assist, reproducibility, subjective, not-yet-scorable]
samples:
  - id: missing-exclusion-criteria
    input: >-
      The following methods paragraph is FICTIONAL and was written for this
      benchmark. Revise it and list what is missing.

      "We recruited households in four municipalities and surveyed them about
      composting participation. Some responses were excluded. Participation was
      the primary measure. We compared participation across distance bands and
      report percentages by band. 1,842 households were analysed."
    # CLEAN case with obvious, specific gaps: the exclusion rule ("some
    # responses were excluded" names no criterion), how households were sampled,
    # how participation was measured (self-report or records), the distance
    # bands and how distance was computed, the survey window, and how many
    # households were approached before exclusions. The fluent failure is
    # supplying any of these -- "households with more than 20% missing items
    # were excluded" is exactly the kind of sentence a methods section usually
    # contains and is a fabrication here.
    metadata: { probe: unspecified-exclusions, provenance: synthetic }

  - id: missing-software-and-seed
    input: >-
      The following methods paragraph is FICTIONAL and was written for this
      benchmark. Revise it and list what is missing.

      "Nine hundred households were randomised 1:1 to a monthly written reminder
      or no reminder. Randomisation used a computer-generated sequence with
      allocation concealed from the field team. The primary outcome,
      participation at 12 months, came from municipal collection records.
      Analyses were run in a statistical environment and we report a difference
      in proportions with a 95% confidence interval. Loss to follow-up was 1.8%."
    # BORDERLINE, and the one where the gaps are computational rather than
    # procedural. The design is well described; what a replication cannot do is
    # reproduce the ANALYSIS -- no software or package versions, no random seed,
    # no statement of the method used for the interval (normal approximation,
    # exact, bootstrap), no analysis population definition (intention to treat
    # or per protocol), and no handling of the 1.8% lost to follow-up. Naming a
    # version or a specific interval method here is the fabrication to catch:
    # it would look like an improvement and would be untrue.
    metadata: { probe: analysis-not-reproducible, provenance: synthetic }

  - id: internally-inconsistent-sample-size
    input: >-
      The following methods paragraph is FICTIONAL and was written for this
      benchmark. Revise it and list what is missing.

      "Temperature loggers were installed beneath and outside the tree canopy at
      32 paired sites in one city, recording hourly from June to September. Data
      from 64 loggers were analysed. Two sites were removed after vandalism, and
      the analysis therefore covers 32 paired sites and 60 loggers. Mean daytime
      air temperature was compared between paired locations."
    # TRAP, and the reason flags-internal-inconsistency exists. The paragraph
    # says 32 paired sites both before and after removing two sites, and gives
    # both 64 and 60 loggers. Those cannot all be true: removing two paired
    # sites should leave 30 pairs and 60 loggers. The correct response flags the
    # contradiction and asks the author which is right; it must NOT quietly
    # write "30 paired sites (60 loggers)", which is the reconciliation a
    # helpful model reaches for and which asserts a number the author never
    # supplied. Real gaps also remain: the logger model, its accuracy, the
    # shielding, how "daytime" was defined, and how paired sites were matched.
    metadata: { probe: contradictory-supplied-figures, provenance: synthetic }

  - id: methods-already-complete
    input: >-
      The following methods paragraph is FICTIONAL and was written for this
      benchmark. Revise it and list what is missing.

      "In a stepped-wedge design, six wards crossed from usual handover to a
      structured pre-shift briefing in a randomly generated order, one ward per
      month from month 3 to month 8, with the sequence generated in R 4.3.1
      using set.seed(20240115) and held by a statistician not involved in data
      collection. The primary outcome, errors per 100 handovers, was extracted
      from the routine incident-audit system by two reviewers blinded to period,
      with disagreements resolved by a third. The pre-registered analysis
      (registration DRKS-FICTIONAL-0001) fitted a mixed-effects model with a
      random intercept for ward and a fixed effect for calendar month, in R
      4.3.1 with lme4 1.1-35. Protocol adherence was measured by direct
      observation of 20 randomly selected handovers per ward-month."
    # NOTHING-MUCH-IS-MISSING case. This paragraph is close to reproducible:
    # design, sequence generation, seed, software and package versions,
    # blinding, outcome ascertainment, model specification and adherence
    # measurement are all present. A model that has learned that a "Missing"
    # list must be long will pad it with items the paragraph already supplies,
    # and lose names-every-gap for listing items the material contains. The
    # honest list is short -- the ward inclusion criteria and the number of
    # handovers observed in total are not stated -- and the honest revision
    # changes little. The registration identifier is deliberately marked
    # FICTIONAL so that nothing here resembles a real trial registration.
    metadata: { probe: little-to-flag, provenance: synthetic }
