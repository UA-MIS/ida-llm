    argocd/app-name: ida-llm-dev
  tags:
    - python
    - typescript
    - llm
    - benchmark
  links:
    - url: https://ida-llm.capstone.uamishub.com
      title: Production
    - url: https://ida-llm-dev.capstone.uamishub.com
      title: Dev
spec:
  type: service
  lifecycle: experimental
  owner: group:default/ida-llm
  system: capstone-2026-fall
