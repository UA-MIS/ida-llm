[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ida-runner"
version = "0.1.0"
description = "Queue workers, scheduled sweeps, and the in-repo mock model endpoint."
requires-python = ">=3.12"
dependencies = [
  "ida-core",
  "ida-harness",
  "redis>=5.2,<7",
  "fastapi>=0.115,<0.120",
  "uvicorn[standard]>=0.32,<0.40",
  "sqlalchemy>=2.0,<3",
  "psycopg[binary]>=3.2,<4",
]

[project.scripts]
# THREE commands, ONE image. The `runner` Deployment, the `mock-model` Deployment
# and all three CronJobs are the same built artifact with a different argv --
# which is what makes "build once, promote the same image" hold across them.
ida-runner = "ida_runner.worker:main"
ida-mock-model = "ida_runner.mock_model:main"
ida-sweep = "ida_runner.sweeps:main"

[tool.setuptools.packages.find]
where = ["src"]
