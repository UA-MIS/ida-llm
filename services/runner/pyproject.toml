[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ida-runner"
version = "0.1.0"
description = "Capstone-IDA queue worker and scheduled sweeps: consumes run jobs, executes the harness, persists results."
requires-python = ">=3.12"
dependencies = [
    "ida-core==0.1.0",
    "ida-harness==0.1.0",
    "psycopg[binary]~=3.2",
    # The runner serves /metrics on :9100 for the ServiceMonitor -- and
    # ida_llm_runner_queue_depth is the HPA's scaling metric, so this is
    # load-bearing, not observability garnish.
    "prometheus-client~=0.26.0",
]

[project.scripts]
# TWO commands, ONE image. The `runner` Deployment and all three CronJobs are the
# same built artifact with a different argv -- which is what makes "build once,
# promote the same image" hold across them. (`ida-mock-model` lives in its own
# distribution, services/mock-model, and installs into the same image.)
ida-runner = "ida_runner.main:main"
ida-sweep = "ida_runner.sweeps:main"

[tool.setuptools.packages.find]
include = ["ida_runner*"]
