[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ida-api"
version = "0.1.0"
description = "Capstone-IDA public API: model registry, task catalog, run enqueue and run/result reads."
requires-python = ">=3.12"
dependencies = [
    "ida-core==0.1.0",
    "ida-harness==0.1.0",
    "fastapi~=0.141.0",
    "uvicorn~=0.52.0",
    "psycopg[binary]~=3.2",
    "prometheus-client~=0.26.0",
    # /readyz checks redis and the object store, so the api needs both clients even
    # though it does not otherwise talk to them yet. Deliberate -- do not "clean up".
    "redis~=5.1",
    "httpx~=0.28.0",
]

[project.scripts]
ida-api = "ida_api.main:main"

[tool.setuptools.packages.find]
include = ["ida_api*"]
