[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ida-api"
version = "0.1.0"
description = "FastAPI read/write API for benchmark runs and results."
requires-python = ">=3.12"
dependencies = [
  "ida-core",
  "fastapi>=0.115,<0.120",
  "uvicorn[standard]>=0.32,<0.40",
  "sqlalchemy>=2.0,<3",
  "psycopg[binary]>=3.2,<4",
]

[project.scripts]
ida-api = "ida_api.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
