# Public Ingress — the frontend ONLY.
#
# api, runner, mock-model, redis and object-store never appear here. The api in
# particular is internal by design: the browser talks to the frontend, and the
# frontend's server side dials `http://ida-llm-api` in-cluster.
#
# ⚠ metadata.name MUST stay `ida-llm`. The platform's `ida-llm-envs`
# ApplicationSet applies a templatePatch targeting `kind: Ingress, name: ida-llm`
# to attach the non-prod SSO forwardAuth middleware. Rename this and dev/staging
# silently lose their auth gate — no error, just an open app.
#
# ── HOST DEPTH IS LOAD-BEARING ────────────────────────────────────────────────
# Public TLS terminates at the Cloudflare edge on a Universal SSL wildcard that
# covers ONE label: *.capstone.uamishub.com. A two-level host like
# ida-llm.dev.capstone.uamishub.com would need a paid Cloudflare Advanced
# Certificate and does NOT resolve to valid public TLS today. That is why the env
# folds into the SAME label (`ida-llm-dev`), not a new one.
#
# ── ⚠ THE MIDDLEWARE ANNOTATION IS PER-INGRESS-OBJECT, NOT PER-RULE ──────────
# Traefik's `router.middlewares` annotation lives on the Ingress OBJECT. Every
# host on this Ingress therefore shares one auth posture per environment. That is
# fine today (one host) and it is the thing to think about when the `agile`
# component adds its own host — see .devops/README.md, which explains why sharing
# this object is still the right call for a prod-only component.
#
# No ingressClassName (Traefik is the cluster default class) and no tls.secretName
# / cert-manager annotation (Traefik's default TLSStore serves the platform
# wildcard on the in-cluster leg; the public cert is Cloudflare's).
#
# Base carries the PROD host; each overlay JSON6902-patches in its own.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ida-llm
  labels:
    app.kubernetes.io/name: ida-llm
spec:
  rules:
    # rules[0] — the main app frontend. THE ONLY RULE THE OVERLAYS PATCH.
    - host: ida-llm.capstone.uamishub.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: ida-llm-frontend
                port:
                  name: http
    # rules[1] — the sprint board. ⚠ AN EXPLICIT, ENVIRONMENT-LESS HOST.
    #
    # Every other host on this platform folds the env into the label
    # (`ida-llm-dev`). This one does NOT, because the board is a single
    # always-on instance for the team rather than a three-environment app — so
    # `ida-agile.capstone.uamishub.com` is the host in EVERY overlay and the
    # per-env patches must leave rules[1] alone. They patch `/spec/rules/0/host`
    # only, by index, for exactly this reason.
    #
    # Still SINGLE-LABEL under capstone.uamishub.com: the Cloudflare Universal
    # SSL wildcard covers exactly one level, so `ida-agile.capstone...` resolves
    # to valid public TLS while `agile.ida-llm.capstone...` would not.
    #
    # On THIS Ingress object rather than its own: the env ApplicationSet attaches
    # the non-prod SSO forwardAuth by targeting `kind: Ingress, name: ida-llm`,
    # so a separate object would silently get no gate. The annotation is
    # per-OBJECT, not per-rule, so in dev/staging this host inherits the
    # org-login gate along with the main app — harmless, since the board runs
    # only in prod, and the correct default if it ever gains a non-prod presence.
    - host: ida-agile.capstone.uamishub.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: ida-llm-agile
                port:
                  name: http
  tls:
    - hosts:
        - ida-llm.capstone.uamishub.com
        # ⚠ The overlays REPLACE this whole list. Each one must re-list the
        # agile host verbatim alongside its own env host, or the router serves a
        # hostname the certificate does not cover.
        - ida-agile.capstone.uamishub.com
