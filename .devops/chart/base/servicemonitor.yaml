# ServiceMonitors — the tenant's OWN application metrics.
#
# Why this matters: Traefik already gives per-host request/latency/error rates
# (`traefik_service_*`), and the platform's generic golden-signals dashboard uses
# them, so a tenant gets traffic panels for free. What Traefik CANNOT see is
# anything INSIDE the app — queue depth, worker liveness, event-loop lag. These
# three ServiceMonitors are what turn "my app's numbers" from a platform-level
# proxy view into real telemetry.
#
# ⚠ ServiceMonitor is a namespaced CRD and must live NEXT TO the Service it
# selects, which is why it ships from this repo rather than platform-infra. It is
# permitted by the tenant AppProject's namespaceResourceWhitelist
# (monitoring.coreos.com/ServiceMonitor).
#
# ⚠ NO `release: kube-prometheus-stack` LABEL IS REQUIRED HERE. Verified against
# the live Prometheus CR: serviceMonitorSelector and
# serviceMonitorNamespaceSelector are BOTH `{}` (match-all), so a ServiceMonitor
# in any namespace is discovered with no label ceremony. The label is added anyway
# as documentation of intent and so this keeps working if those selectors are ever
# tightened.
#
# ⚠ EVERY SCRAPED PORT MUST BE A CONTAINER PORT NAMED `http`. The
# Composition-owned netpol allows ingress from `monitoring` on `port: http` only,
# and a NetworkPolicy port name matches the CONTAINER port name. A scrape blocked
# that way shows up as `context deadline exceeded` (a blackhole), not
# `connection refused` — i.e. it looks like a broken exporter, not a firewall.
# See the runner container in deployments.yaml.
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: ida-llm-api
  labels:
    app.kubernetes.io/name: ida-llm
    app.kubernetes.io/component: api
    release: kube-prometheus-stack
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: ida-llm
      app.kubernetes.io/component: api
  endpoints:
    - port: http          # the Service port name
      path: /metrics
      interval: 30s
      scrapeTimeout: 10s
---
# The runner is a queue consumer with no API. Its Service exists ONLY so this
# ServiceMonitor has something to select — without it the workers are invisible
# to Prometheus and the sole symptom of "every worker died" is a queue that
# quietly stops draining, which nobody watches at 03:00.
#
# The Service is HEADLESS, which is what makes per-worker questions answerable:
# Prometheus gets one target PER POD, so `sum(ida_llm_runner_up)` is a real count
# of live workers. Against a load-balanced ClusterIP it would scrape one random
# worker per interval and the count would always be 1.
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: ida-llm-runner
  labels:
    app.kubernetes.io/name: ida-llm
    app.kubernetes.io/component: runner
    release: kube-prometheus-stack
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: ida-llm
      app.kubernetes.io/component: runner
  endpoints:
    - port: metrics
      path: /metrics
      interval: 30s
      scrapeTimeout: 10s
---
# Frontend: Node process internals (event-loop lag, heap, handles) — the class of
# problem that makes a Next.js pod slow without making it fail, and which the
# Traefik-level view cannot distinguish from a slow backend.
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: ida-llm-frontend
  labels:
    app.kubernetes.io/name: ida-llm
    app.kubernetes.io/component: frontend
    release: kube-prometheus-stack
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: ida-llm
      app.kubernetes.io/component: frontend
  endpoints:
    - port: http
      path: /api/metrics
      interval: 30s
      scrapeTimeout: 10s
