# The one ServiceAccount every ida-llm workload runs as.
#
# `harbor-pull` is the imagePullSecret for the team's private Harbor project.
# This repo deliberately does NOT ship that Secret: it is created in each env
# namespace by the CapstoneTenant Composition (an ExternalSecret over Vault
# tenants/ida-llm/<env>/harbor-pull). Shipping a second copy would give the object
# two owners and trip ArgoCD's SharedResourceWarning, blocking sync. We only
# reference it by name.
#
# automountServiceAccountToken: false — no workload here talks to the Kubernetes
# API, so no pod gets a mountable API token. (ESO authenticates to Vault with the
# SEPARATE, Composition-owned `eso-tenant` SA, not this one.)
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ida-llm
  labels:
    app.kubernetes.io/name: ida-llm
automountServiceAccountToken: false
imagePullSecrets:
  - name: harbor-pull
