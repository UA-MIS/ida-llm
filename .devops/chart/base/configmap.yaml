# Shared NON-SECRET runtime config. Every workload does
# `envFrom: configMapRef: ida-llm-config` and ignores the keys it doesn't use —
# simpler than six near-identical ConfigMaps. Secrets never appear here; they
# arrive via ESO (see the overlays' ExternalSecrets).
#
# In-cluster service DNS: short Service names resolve within the namespace, so
# `ida-llm-api` etc. need no FQDN.
apiVersion: v1
kind: ConfigMap
metadata:
  name: ida-llm-config
data:
  LOG_LEVEL: "info"

  # Every listener must bind 0.0.0.0, NOT the app defaults (127.0.0.1) — a
  # loopback bind is invisible to both kube-proxy and the kubelet's probes.
  HOST: "0.0.0.0"

  # --- datastores (in-namespace) ---
  REDIS_URL: "redis://ida-llm-redis:6379/0"

  # --- object store (in-namespace MinIO on a PVC) ---
  MINIO_ENDPOINT: "ida-llm-object-store"
  MINIO_PORT: "9000"
  MINIO_USE_SSL: "false"
  MINIO_BUCKET: "run-artifacts"

  # --- service-to-service ---
  API_URL: "http://ida-llm-api"

  # ── RUN-EXECUTION AUTH: THE ARMING SWITCH ───────────────────────────────────
  # Absent, which means the app default `disabled` applies: the anonymous caller
  # holds `runner` and can enqueue runs. That is correct TODAY only because the
  # api has no public Ingress — containment by routing, not by design.
  #
  # Setting this to "token" is what arms the gate: anonymous keeps `reader` (the
  # results view stays public by design — docs/sensitive-material.md section 1)
  # and `POST /runs`, which spends real provider money, requires a bearer token
  # from the IDA_AUTH_TOKENS secret.
  #
  # DO NOT set it here before that secret is seeded and referenced: the api
  # refuses to start with `token` and no tokens, which is deliberate — a pod that
  # cannot enforce its auth mode must fail readiness, not serve without the
  # control. Full procedure: docs/sensitive-material.md section 6.
  # IDA_AUTH_MODE: "token"

  # ── THE JUDGE: SUBJECTIVE SCORING IS NOW ON ─────────────────────────────────
  # Names an entry in models.yaml; the runner builds one judge per process from
  # it (ida_runner.judging.build_judge_from_settings) and run_task grades every
  # subjective sample against its rubric.
  #
  # UNSET MEANT UNSCORED. models.yaml's header is explicit that there is no
  # default "because unset means subjective tasks stay unscored with their
  # transcripts archived, rather than every run quietly starting to spend money".
  # Setting it is therefore the deliberate act that header describes, and it is
  # taken here knowingly: 150 of the 328 catalogue samples are subjective, and
  # without a judge the benchmark's subjective half is permanently blank.
  #
  # ⚠ THIS SPENDS MONEY PER CRITERION, NOT PER SAMPLE. ida_harness.judge issues
  # ONE model call per rubric criterion, deliberately, so that no call sees two
  # criteria and rubric order cannot move a score. At a mean of 4.6 criteria the
  # 150 subjective samples cost ~690 judge calls, and each call re-sends the
  # prompt and the answer. The judge, not the model pass, is the larger bill.
  #
  # What still stops an unattended charge: the three sweep CronJobs remain
  # `suspend: true` (D-43), so nothing fires on a timer. This key makes a run
  # that a human starts grade its subjective half; it does not start any run.
  IDA_JUDGE_MODEL_KEY: "luna"

  # ── THE CREDIT/HARDWARE SAFETY SWITCH ───────────────────────────────────────
  # MOCK_MODEL_BASE_URL points the harness at the in-namespace deterministic stub
  # instead of a paid provider. Base carries the PROD value, which is EMPTY — prod
  # is the one environment that must use real models. The dev and preview overlays
  # patch it to the mock Service.
  #
  # Set here rather than only in CI on purpose: "no PR burns credits" is a
  # property of the DEPLOYED environment as much as of the pipeline, and a rule
  # that lives in one workflow file is a rule somebody's next workflow forgets.
  MOCK_MODEL_BASE_URL: ""

  # ── HIDE THE TEST STUB FROM THE PUBLIC VIEW ─────────────────────────────────
  # Models carrying any of these tags are withheld from GET /models, the
  # leaderboard, Explore and the recommender (Settings.public_hide_tags). It is a
  # VIEW filter, not a disable: runs, sweeps and CI still see the model. Base
  # carries the PROD value (hide `mock`); dev and preview patch it to empty so
  # the demo and the tracer keep showing the stub. A ConfigMap value rather than
  # a dev-only file override because chart-render forbids those in prod, and
  # because one image is promoted byte-identically across environments.
  IDA_PUBLIC_HIDE_TAGS: "mock"

  # ── SPARKS: WIRED, UNSET, AND THAT IS THE CURRENT DESIGN ────────────────────
  # The campus-hosted vLLM endpoint. Deliberately empty: the cluster's egress
  # policy opens :443 to the internet but NOT a route to Sparks (deferred by owner
  # decision — platform-infra/platform-services/ida-llm-egress/netpol.yaml carries
  # the exact one-block change and the three traps).
  #
  # Leaving the key PRESENT and empty rather than absent is the point: the
  # `sparks-local` model in models.yaml then fails fast with a clear message
  # instead of hanging until a connection times out, and turning Sparks on later
  # is a value change here plus that one netpol block — no manifest surgery.
  SPARKS_BASE_URL: ""
