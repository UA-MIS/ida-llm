# prod overlay.
#
# ⚠ NOTHING GIT-TRIGGERED WRITES THIS FILE. The only writer is a human running
# .github/workflows/promote-to-prod.yaml, which copies the tag currently running
# in staging. There is no build step in that path — promotion is a tag copy, so
# what reaches prod is the byte-identical artifact staging proved.
#
# Base already carries the prod shape (prod hosts, prod replicas, 10Gi PVC,
# mock-model at 0), so this overlay is deliberately THIN: the fewer patches prod
# has, the fewer ways prod can differ from what was reviewed.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: ida-llm-prod

resources:
  - ../../base
  - app-secret.externalsecret.yaml
  - database.externalsecret.yaml
  # ── THE SPRINT BOARD IS GONE FROM HERE ────────────────────────────────────
  # This overlay used to carry agile.yaml, agile-config.yaml and
  # agile-secret.externalsecret.yaml, serving a team-built board at
  # `ida-agile.capstone.uamishub.com`. The team migrated to the PLATFORM board
  # (`ida-llm-agile.capstone.uamishub.com`, namespace `agile`, from
  # platform-services/agile-boards), and running both left two live boards whose
  # data had already diverged — the old one 6 items and 14 hours behind. Two
  # boards is worse than either board, because the wrong one still answers.
  #
  # Removed rather than scaled to zero: the defect this file's own history
  # records was a stale Ingress HOST RULE outliving its purpose, and a
  # zero-replica Deployment would have kept exactly that.

labels:
  - pairs:
      platform.capstone/env: prod
      platform.capstone/semester: "2026-fall"
    includeSelectors: false

images:
  - name: ida-llm-frontend
    newName: harbor.capstone.uamishub.com/ida-llm/ida-llm-frontend
    newTag: "0.1.12"
  - name: ida-llm-python-app
    newName: harbor.capstone.uamishub.com/ida-llm/ida-llm-python-app
    newTag: "0.1.12"
  # KEPT DELIBERATELY THOUGH THIS OVERLAY NO LONGER RUNS THE BOARD. The image is
  # still BUILT (components.yaml is unchanged), and both the promotion invariant
  # -- every overlay pins all three components at one tag -- and
  # chart-render.test.sh's "all 3 built components have an images[] entry" are
  # written against that build list, not against what an overlay deploys. The
  # entry is inert here: no resource references the image, so kustomize emits
  # nothing for it.
  - name: ida-llm-agile
    newName: harbor.capstone.uamishub.com/ida-llm/ida-llm-agile
    newTag: "0.1.12"

# ── RUN-EXECUTION AUTH ARMED (D-49 section 6) — THE ONE prod PATCH ────────────
# prod otherwise carries NO patches: every prod value lives in base, where a
# reviewer reads it directly rather than reconstructing it from a diff (hosts,
# replicas, storage, mock-model-off are all base defaults). Arming run-auth is
# the deliberate exception.
#
# Scoped here (not base) because base/deployments.yaml's IDA_AUTH_TOKENS
# secretKeyRef is shared by ALL overlays, but dev + preview never seed the Vault
# key (preview's ida-llm-secret is platform-owned, mock creds only) — arming in
# base would park their api pods in CreateContainerConfigError. staging + prod
# are the only envs that seed the token, so the mode flag and the env ref live
# in those two overlays. Gate is on `POST /runs` only; reads stay public (the
# public results view is the product — docs/sensitive-material.md section 1).
#
# ORDER AT SYNC: the Vault key must be seeded (see app-secret.externalsecret
# .yaml) BEFORE this syncs. The ref is not `optional: true` and the api refuses
# to boot under auth_mode=token with no tokens — both failures are loud
# (CreateContainerConfigError / readiness fail), never a silent open gate. prod
# is human-promoted (promote-to-prod.yaml), so this never auto-applies.
patches:
  - target: { kind: ConfigMap, name: ida-llm-config }
    patch: |-
      - op: add
        path: /data/IDA_AUTH_MODE
        value: token
  # containers[0] on the api Deployment is `api` (its only container; `migrate`
  # is an initContainer). Append the token ref to that container's env.
  - target: { kind: Deployment, name: ida-llm-api }
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: IDA_AUTH_TOKENS
          valueFrom:
            secretKeyRef:
              name: ida-llm-secret
              key: IDA_AUTH_TOKENS
