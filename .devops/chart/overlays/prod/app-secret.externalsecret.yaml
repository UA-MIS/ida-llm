# App secrets for prod, materialized by ESO from the team's Vault subtree.
#
# NOTHING SECRET IS IN GIT. This file names Vault paths and property keys only;
# the values are seeded out-of-band by the operator with
#   vault kv put secret/tenants/ida-llm/prod/app KEY=...
# Until that happens this ExternalSecret sits SecretSyncError and the pods stay in
# CreateContainerConfigError — a LOUD, correct failure mode. The secretKeyRefs in
# the chart are deliberately NOT `optional: true`, so a pod can never boot
# silently mis-configured (the env-injection race: a pod that starts before ESO
# writes the Secret keeps its unresolved env for the life of the container).
#
# The SecretStore `vault-tenant` and its `eso-tenant` ServiceAccount are NOT
# declared here: the CapstoneTenant Composition already creates both in every env
# namespace. Shipping our own copies would make them dual-owned and fight
# Crossplane. We only reference the store by name.
#
# Vault role tenant-ida-llm grants read on secret/data/tenants/ida-llm/*, so
# adding keys under this path needs no policy change.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  annotations:
    platform.capstone/declared-keys: "ANTHROPIC_API_KEY,IDA_AUTH_TOKENS,MINIO_ACCESS_KEY,MINIO_SECRET_KEY,OPENAI_API_KEY,SPARKS_API_KEY"
  name: ida-llm-secret
  labels:
    app.kubernetes.io/name: ida-llm
spec:
  refreshInterval: "1h"
  secretStoreRef:
    name: vault-tenant
    kind: SecretStore
  target:
    name: ida-llm-secret
    creationPolicy: Owner
    deletionPolicy: Delete
  data:
    - secretKey: "IDA_AUTH_TOKENS"
      remoteRef:
        key: "tenants/ida-llm/prod/app"
        property: "IDA_AUTH_TOKENS"
    # MinIO credentials. These are BOTH the client creds (api + runner read/write
    # artifacts) AND the root creds of the in-namespace MinIO — one value, one
    # source of truth, no drift.
    - secretKey: MINIO_ACCESS_KEY
      remoteRef: { key: tenants/ida-llm/prod/app, property: MINIO_ACCESS_KEY }
    - secretKey: MINIO_SECRET_KEY
      remoteRef: { key: tenants/ida-llm/prod/app, property: MINIO_SECRET_KEY }
    # Cloud model provider keys. PER-ENVIRONMENT on purpose: a dev key that leaks
    # must not be spendable against the production budget, and per-env keys make
    # provider-side spend attributable to an environment.
    - secretKey: ANTHROPIC_API_KEY
      remoteRef: { key: tenants/ida-llm/prod/app, property: ANTHROPIC_API_KEY }
    - secretKey: OPENAI_API_KEY
      remoteRef: { key: tenants/ida-llm/prod/app, property: OPENAI_API_KEY }
    # Campus vLLM ("Sparks") credential. Seeded as a placeholder today — the
    # cluster egress policy does not open a route to Sparks yet (deferred by owner
    # decision). Present so that turning Sparks on later is a Vault write plus one
    # netpol block, with no manifest change.
    - secretKey: SPARKS_API_KEY
      remoteRef: { key: tenants/ida-llm/prod/app, property: SPARKS_API_KEY }
    # ── RUN-EXECUTION AUTH (D-49 section 6) — COMMENTED, AND THE ORDER MATTERS ──
    # `IDA_AUTH_TOKENS` is what lets someone trigger a run, which spends real
    # provider money. It is NOT referenced yet, on purpose: the secretKeyRefs in
    # this chart are deliberately not `optional: true`, so naming a Vault property
    # that has not been seeded would hold every api pod in
    # CreateContainerConfigError. Seed first, then uncomment — here AND the
    # matching env entry on the `api` container in base/deployments.yaml — then
    # set IDA_AUTH_MODE: "token" in the ConfigMap.
    #
    #   vault kv put secret/tenants/ida-llm/prod/app \
    #     IDA_AUTH_TOKENS='ci:<token>,prof-smith:<token>'
    #
    # Generate each token with:
    #   python -c "import secrets; print(secrets.token_urlsafe(32))"
    # Per-environment like the provider keys above, and for the same reason: a
    # dev credential that leaks must not be spendable against prod's budget.
    # - secretKey: IDA_AUTH_TOKENS
    #   remoteRef: { key: tenants/ida-llm/prod/app, property: IDA_AUTH_TOKENS }
