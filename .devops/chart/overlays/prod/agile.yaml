# The sprint board — PROD ONLY, enforced by WHERE THIS FILE LIVES rather than by
# a replicas:0 patch in every other overlay.
#
# ⚠ THIS USED TO LIVE IN base/ AND THAT WAS A BUG. base/ renders into EVERY
# overlay, so the board's Ingress HOST RULE was declared on all three tenant
# Ingress objects (dev, staging AND prod). Three objects claiming
# `ida-agile.capstone.uamishub.com` means Traefik picks among them
# NON-DETERMINISTICALLY — and only prod had a backend. The symptom was the worst
# kind: the board worked INTERMITTENTLY. A request landing on prod's Ingress
# returned 200; the same request a minute later landed on dev's or staging's,
# which carry the tenant SSO middlewares, and got a 302 to Dex with
# `client_id=db-console` — a different application's auth proxy entirely, which
# also breaks bearer-token API access outright.
#
# Scaling the Deployment to 0 elsewhere did NOT help and could not: an Ingress
# host rule is claimed by the RULE, not by whether its backend has endpoints.
# The rule must exist in exactly ONE place. It now does.
---
# ── agile: the ADO-style sprint board (apps/agile) ───────────────────────────
# PROD ONLY. The dev/staging/preview overlays scale this to 0 — it is a single
# always-on instance for the team, not a three-environment application, and
# running three copies would triple its GitHub API polling for no benefit.
#
# ⚠ NO MIGRATION initContainer, unlike `api`, and that is not an oversight. This
# app runs its own migrations at request time via ensureSchema(), which is
# memoised per module instance, idempotent, and ADVISORY-LOCKED — so concurrent
# pods serialise rather than race. Its /readyz awaits that call directly (rather
# than an in-memory "migrations done" flag, which a Next standalone build would
# never observe from a route handler), so the pod reports NotReady until the
# schema is actually present. Adding an initContainer on top would run the same
# locked migration twice for no gain.
#
# ⚠ readOnlyRootFilesystem: true. Its own Dockerfile states the invariant —
# "no writable state on the filesystem: everything durable is in Postgres, and
# uploads go to object storage". Next.js normally needs a writable .next/cache,
# which is why the FRONTEND deployment above cannot do this; this app's
# standalone server does not, because nothing here is statically regenerated.
# The emptyDir on /tmp covers Node's incidental scratch use.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ida-llm-agile
  labels:
    app.kubernetes.io/name: ida-llm
    app.kubernetes.io/component: agile
  annotations:
    secret.reloader.stakater.com/reload: "ida-llm-agile-secret,ida-llm-db"
spec:
  # ⚠ replicas MUST stay 1 unless the app is checked for multi-instance safety.
  # It runs a BACKGROUND POLLER against the GitHub API; N replicas means N times
  # the rate-limit consumption against one token, and duplicate webhook
  # processing. Scale only after that is addressed in the app.
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: ida-llm
      app.kubernetes.io/component: agile
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ida-llm
        app.kubernetes.io/component: agile
    spec:
      serviceAccountName: ida-llm
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: agile
          image: ida-llm-agile:latest
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: ida-llm-agile-config
          env:
            - name: PORT
              value: "8080"
            # Next standalone reads HOSTNAME (not HOST) for its bind address.
            - name: HOSTNAME
              value: "0.0.0.0"
            # ⚠ THE SAME tenant database as the rest of the app. Its own SCHEMA
            # (AGILE_DB_SCHEMA=agile, set in the ConfigMap) keeps it separated
            # WITHIN that database — the XRD provisions one engine per tenant, so
            # a second database was never an option, and a second CapstoneTenant
            # claim for this team would fight the first over the same namespaces.
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: ida-llm-db
                  key: DATABASE_URL
            - name: SESSION_SECRET
              valueFrom:
                secretKeyRef:
                  name: ida-llm-agile-secret
                  key: SESSION_SECRET
            - name: OIDC_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: ida-llm-agile-secret
                  key: OIDC_CLIENT_SECRET
            # Optional git integration. Both are `optional: true` DELIBERATELY,
            # unlike every other secretKeyRef in this chart: the app documents a
            # working fallback for each (webhook -> background polling, poll token
            # -> on-view refresh), so a missing value degrades a feature rather
            # than misconfiguring the service. Where there is no fallback —
            # SESSION_SECRET, OIDC_CLIENT_SECRET above — the ref stays required so
            # the pod fails loudly instead of booting half-authenticated.
            - name: GITHUB_WEBHOOK_SECRET
              valueFrom:
                secretKeyRef:
                  name: ida-llm-agile-secret
                  key: GITHUB_WEBHOOK_SECRET
                  optional: true
            - name: GITHUB_POLL_TOKEN
              valueFrom:
                secretKeyRef:
                  name: ida-llm-agile-secret
                  key: GITHUB_POLL_TOKEN
                  optional: true
            # ── The board's OWN GitHub identity ────────────────────────────
            # Under Dex a session carries identity and groups but NO GitHub
            # token, so the assignee picker, "Start work" branch creation and PR
            # backlink comments have nothing to call the API with. These three
            # give the board an identity of its own: the SAME platform GitHub
            # App every tool here already uses, so provisioning a new board is a
            # copy of three values, not a new App registration.
            #
            # ⚠ The private key is a multi-line PEM — the single most fragile
            # thing to carry through Vault -> ESO -> env. Seed it BASE64-ENCODED
            # into Vault; the app also accepts real newlines and `\n`-escaped
            # newlines, so a key mangled in transit still works instead of
            # producing an opaque 401 on every GitHub call.
            #
            # `optional: true`, like the two above: a board without them degrades
            # to the acting user's own token rather than failing to start. What
            # is NOT optional any more is knowing — the pod logs
            # `[startup] GitHub credential: ...` on boot, so "configured but
            # inert" (which is exactly how this broke) cannot be silent again.
            - name: GITHUB_APP_ID
              valueFrom:
                secretKeyRef:
                  name: ida-llm-agile-secret
                  key: GITHUB_APP_ID
                  optional: true
            - name: GITHUB_APP_INSTALLATION_ID
              valueFrom:
                secretKeyRef:
                  name: ida-llm-agile-secret
                  key: GITHUB_APP_INSTALLATION_ID
                  optional: true
            - name: GITHUB_APP_PRIVATE_KEY
              valueFrom:
                secretKeyRef:
                  name: ida-llm-agile-secret
                  key: GITHUB_APP_PRIVATE_KEY
                  optional: true
            # Attachment storage reuses the tenant's own MinIO — same credentials,
            # its own bucket. All four MINIO_* keys must be present or the app
            # leaves attachments disabled; endpoint/port/ssl/bucket come from the
            # ConfigMap, the two credentials from here.
            - name: MINIO_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: ida-llm-secret
                  key: MINIO_ACCESS_KEY
            - name: MINIO_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: ida-llm-secret
                  key: MINIO_SECRET_KEY
          readinessProbe:
            # /readyz awaits ensureSchema() then pings the DB, so the pod stays
            # NotReady until migrations have actually applied.
            httpGet: { path: /api/readyz, port: http }
            initialDelaySeconds: 5
            periodSeconds: 10
            # Migrations run on the first request; give them room before the
            # probe starts failing the pod.
            failureThreshold: 12
          livenessProbe:
            httpGet: { path: /api/healthz, port: http }
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests: { cpu: "100m", memory: "256Mi" }
            limits: { cpu: "500m", memory: "512Mi" }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
---
# The sprint board's Service. Prod only, like everything else in this file.
apiVersion: v1
kind: Service
metadata:
  name: ida-llm-agile
  labels:
    app.kubernetes.io/name: ida-llm
    app.kubernetes.io/component: agile
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: ida-llm
    app.kubernetes.io/component: agile
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
---
# ⚠ ITS OWN Ingress OBJECT, deliberately NOT a rule on the tenant's `ida-llm`
# Ingress. Two independent reasons, and the second is the one that bit:
#
#  1. LIFECYCLE. The board is a separate application with its own host; bolting
#     it onto the app's Ingress coupled the two for no benefit.
#
#  2. MIDDLEWARE. Traefik's `router.middlewares` annotation is per-Ingress
#     OBJECT, not per-rule. The platform's env ApplicationSet attaches the
#     non-prod SSO forwardAuth by targeting `kind: Ingress, name: ida-llm` — so
#     ANY host sharing that object inherits the oauth2-proxy gate. For this app
#     that is actively wrong: it authenticates itself via Dex OIDC, so the proxy
#     DOUBLE-GATES the UI and makes bearer-token API access impossible.
#
# Named `ida-llm-agile`, NOT `ida-llm`, so the templatePatch cannot match it.
# That is the whole mechanism keeping this object middleware-free — do not
# rename it to match the app.
#
# No `ingressClassName` (Traefik is the cluster default) and no tls.secretName
# (Traefik's default TLSStore serves the platform wildcard; the public cert is
# Cloudflare's). Single-label host: the Cloudflare Universal SSL wildcard covers
# exactly one level under capstone.uamishub.com.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ida-llm-agile
  labels:
    app.kubernetes.io/name: ida-llm
    app.kubernetes.io/component: agile
spec:
  rules:
    - host: ida-agile.capstone.uamishub.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: ida-llm-agile
                port:
                  name: http
  tls:
    - hosts:
        - ida-agile.capstone.uamishub.com
