# Sprint-board secrets for prod, materialized by ESO from the team's Vault subtree.
#
# ⚠ PROD ONLY. The board runs only in prod, so this file exists only in this
# overlay — dev/staging/preview scale the Deployment to 0 and have no secret to
# resolve. Shipping it everywhere would leave three ExternalSecrets permanently
# in SecretSyncError pointing at Vault paths nobody seeded, which trains people
# to ignore red.
#
# NOTHING SECRET IS IN GIT. This names Vault paths and property keys only:
#   vault kv put secret/tenants/ida-llm/prod/agile SESSION_SECRET=... ...
#
# ── WHY A SEPARATE SECRET FROM ida-llm-secret ────────────────────────────────
# Blast radius. The board holds a GitHub token and an OIDC client secret; the
# benchmark app holds cloud-provider API keys. Neither needs the other's, and a
# separate object means the runner pods never mount the board's GitHub
# credential and vice versa. (MINIO_ACCESS_KEY/SECRET_KEY are the deliberate
# exception — the board reuses the tenant's own object store, so it reads those
# two from ida-llm-secret rather than duplicating them here, which would create
# two sources of truth for one credential.)
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ida-llm-agile-secret
  labels:
    app.kubernetes.io/name: ida-llm
    app.kubernetes.io/component: agile
spec:
  refreshInterval: "1h"
  secretStoreRef:
    name: vault-tenant
    kind: SecretStore
  target:
    name: ida-llm-agile-secret
    creationPolicy: Owner
    deletionPolicy: Delete
  data:
    # Signs the session cookie. >= 32 chars. Rotating it logs everyone out --
    # which is the correct behaviour, and why it is not shared with anything else.
    - secretKey: SESSION_SECRET
      remoteRef: { key: tenants/ida-llm/prod/agile, property: SESSION_SECRET }
    # The Dex static-client secret. MUST equal the value sealed into the
    # `dex-github` SealedSecret under key `ida-agile-client-secret`
    # (platform-infra/platform-services/dex/). If the two ever disagree, sign-in
    # fails at the token exchange with an opaque OIDC error -- the correct
    # failure mode for a client-secret mismatch, but a confusing one to read, so
    # rotate BOTH SIDES TOGETHER.
    - secretKey: OIDC_CLIENT_SECRET
      remoteRef: { key: tenants/ida-llm/prod/agile, property: OIDC_CLIENT_SECRET }
    # ── OPTIONAL, and genuinely optional ────────────────────────────────────
    # The Deployment marks both of these `optional: true` because the app
    # documents a working fallback for each: no webhook secret -> background
    # polling; no poll token -> refresh on view. They are seeded as placeholders
    # so the keys exist; replacing them is a Vault write with no redeploy.
    - secretKey: GITHUB_WEBHOOK_SECRET
      remoteRef: { key: tenants/ida-llm/prod/agile, property: GITHUB_WEBHOOK_SECRET }
    - secretKey: GITHUB_POLL_TOKEN
      remoteRef: { key: tenants/ida-llm/prod/agile, property: GITHUB_POLL_TOKEN }
    # ── REMOVED: the platform GitHub App credential (SEC-037) ───────────────
    # GITHUB_APP_ID / GITHUB_APP_INSTALLATION_ID / GITHUB_APP_PRIVATE_KEY used to
    # be materialized here. They are gone deliberately. Do not add them back.
    #
    # WHAT THE OLD COMMENT GOT BACKWARDS. It read:
    #
    #   "These name the PLATFORM App (`ua-mis-backstage`), installed org-wide —
    #    not a per-team registration. The same three values serve every board
    #    this platform provisions, which is why they are ordinary tenant-path
    #    properties and nothing here is specific to ida-llm."
    #
    # The premise is right and the conclusion inverts it. Being shared by every
    # board is precisely what makes these NOT ordinary tenant-path properties.
    # `ua-mis-backstage` (app_id 4097147) is installed on `repository_selection:
    # all` with `administration: write`, `contents: write` and `workflows: write`,
    # and it is a branch-protection bypass on `platform-infra` main. A per-team
    # credential leaking costs one team; this one costs the organisation.
    #
    # WHY THIS PATH CANNOT HOLD IT. `ida-llm-prod` is reconciled by ArgoCD from
    # THIS repository at `targetRevision: HEAD` — a repo the team owns and is
    # expected to edit. Kubernetes has no per-pod, per-Secret permission: any pod
    # in a namespace may mount any Secret in it. So any commit here that adds
    # three lines of `envFrom` — or any change to the board's own image, which
    # this team also builds — prints an org-admin GitHub key. That is not a
    # misconfiguration to tighten; it is the namespace boundary working as
    # designed, with the wrong thing inside it.
    #
    # WHERE IT LIVES INSTEAD. `platform/agile-board` in Vault, read through the
    # cluster-scoped `vault-backend` store into the platform-owned `agile`
    # namespace, by platform-infra/platform-services/agile-boards/. The
    # `vault-tenant` store used below structurally cannot read `platform/*`,
    # which is the point. See that chart's shared-secret.yaml, whose header
    # describes this hazard in the abstract; SEC-037 is the concrete instance.
    #
    # WHAT THIS COSTS UNTIL THE BOARD MIGRATES. Three features lose their GitHub
    # identity: the assignee picker, "Start work" branch creation, and PR backlink
    # comments. The refs in agile.yaml are `optional: true`, so the pod starts
    # normally and logs `[startup] GitHub credential: ...` naming what is absent.
    # Sign-in, sessions, webhook ingest, polling and all board data are unaffected
    # — none of them use the App. Restoring the features is the migration onto
    # the platform chart, not a re-add here.
