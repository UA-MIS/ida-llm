# Sprint-board secrets for prod, materialized by ESO from the team's Vault subtree.
#
# ⚠ PROD ONLY. The board runs only in prod, so this file exists only in this
# overlay — dev/staging/preview scale the Deployment to 0 and have no secret to
# resolve. Shipping it everywhere would leave three ExternalSecrets permanently
# in SecretSyncError pointing at Vault paths nobody seeded, which trains people
# to ignore red.
#
# NOTHING SECRET IS IN GIT. This names Vault paths and property keys only:
#   vault kv put secret/tenants/ida-llm/prod/agile SESSION_SECRET=... ...
#
# ── WHY A SEPARATE SECRET FROM ida-llm-secret ────────────────────────────────
# Blast radius. The board holds a GitHub token and an OIDC client secret; the
# benchmark app holds cloud-provider API keys. Neither needs the other's, and a
# separate object means the runner pods never mount the board's GitHub
# credential and vice versa. (MINIO_ACCESS_KEY/SECRET_KEY are the deliberate
# exception — the board reuses the tenant's own object store, so it reads those
# two from ida-llm-secret rather than duplicating them here, which would create
# two sources of truth for one credential.)
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ida-llm-agile-secret
  labels:
    app.kubernetes.io/name: ida-llm
    app.kubernetes.io/component: agile
spec:
  refreshInterval: "1h"
  secretStoreRef:
    name: vault-tenant
    kind: SecretStore
  target:
    name: ida-llm-agile-secret
    creationPolicy: Owner
    deletionPolicy: Delete
  data:
    # Signs the session cookie. >= 32 chars. Rotating it logs everyone out --
    # which is the correct behaviour, and why it is not shared with anything else.
    - secretKey: SESSION_SECRET
      remoteRef: { key: tenants/ida-llm/prod/agile, property: SESSION_SECRET }
    # The Dex static-client secret. MUST equal the value sealed into the
    # `dex-github` SealedSecret under key `ida-agile-client-secret`
    # (platform-infra/platform-services/dex/). If the two ever disagree, sign-in
    # fails at the token exchange with an opaque OIDC error -- the correct
    # failure mode for a client-secret mismatch, but a confusing one to read, so
    # rotate BOTH SIDES TOGETHER.
    - secretKey: OIDC_CLIENT_SECRET
      remoteRef: { key: tenants/ida-llm/prod/agile, property: OIDC_CLIENT_SECRET }
    # ── OPTIONAL, and genuinely optional ────────────────────────────────────
    # The Deployment marks both of these `optional: true` because the app
    # documents a working fallback for each: no webhook secret -> background
    # polling; no poll token -> refresh on view. They are seeded as placeholders
    # so the keys exist; replacing them is a Vault write with no redeploy.
    - secretKey: GITHUB_WEBHOOK_SECRET
      remoteRef: { key: tenants/ida-llm/prod/agile, property: GITHUB_WEBHOOK_SECRET }
    - secretKey: GITHUB_POLL_TOKEN
      remoteRef: { key: tenants/ida-llm/prod/agile, property: GITHUB_POLL_TOKEN }
    # ── The board's GitHub App credential ───────────────────────────────────
    # THE fix for "I sign in and cannot see myself as an assignee". A Dex session
    # carries no GitHub token, so without these the board cannot call GitHub at
    # all and three features fail SILENTLY: the assignee picker, "Start work"
    # branch creation, and PR backlink comments.
    #
    # These name the PLATFORM App (`ua-mis-backstage`), installed org-wide — not
    # a per-team registration. The same three values serve every board this
    # platform provisions, which is why they are ordinary tenant-path properties
    # and nothing here is specific to ida-llm.
    #
    # ⚠ GITHUB_APP_PRIVATE_KEY is a multi-line PEM. Seed it BASE64-ENCODED:
    #     vault kv patch secret/tenants/ida-llm/prod/agile \
    #       GITHUB_APP_PRIVATE_KEY="$(base64 -w0 < app.private-key.pem)"
    # The app decodes base64 and also repairs `\n`-escaped and CRLF newlines, so
    # a PEM mangled anywhere in this pipeline still parses. Verify by reading it
    # back INSIDE the pod, not by trusting the write.
    - secretKey: GITHUB_APP_ID
      remoteRef: { key: tenants/ida-llm/prod/agile, property: GITHUB_APP_ID }
    - secretKey: GITHUB_APP_INSTALLATION_ID
      remoteRef: { key: tenants/ida-llm/prod/agile, property: GITHUB_APP_INSTALLATION_ID }
    - secretKey: GITHUB_APP_PRIVATE_KEY
      remoteRef: { key: tenants/ida-llm/prod/agile, property: GITHUB_APP_PRIVATE_KEY }
