# staging overlay — the rehearsal for prod, so it uses REAL models.
#
# That is the deliberate difference from dev: dev's default is the mock (free,
# offline), staging's is the real provider. A staging that mocked its models
# would prove the deploy path and nothing about the thing the app exists to do,
# and the first real inference call would then happen in production.
#
# Written by the promotion seam: a `vX.Y.Z` tag build points BOTH images here at
# the same immutable tag. Nothing else writes this file.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: ida-llm-staging

resources:
  - ../../base
  - app-secret.externalsecret.yaml
  - database.externalsecret.yaml

labels:
  - pairs:
      platform.capstone/env: staging
      platform.capstone/semester: "2026-fall"
    includeSelectors: false

images:
  - name: ida-llm-frontend
    newName: harbor.capstone.uamishub.com/ida-llm/ida-llm-frontend
    newTag: "1.1.0"
  - name: ida-llm-python-app
    newName: harbor.capstone.uamishub.com/ida-llm/ida-llm-python-app
    newTag: "1.1.0"
  - name: ida-llm-agile
    newName: harbor.capstone.uamishub.com/ida-llm/ida-llm-agile
    newTag: "1.1.0"

patches:
  - target: { kind: Deployment, name: ida-llm-frontend }
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 1
  - target: { kind: Deployment, name: ida-llm-api }
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 1
  # Two runners, not prod's four: enough to exercise real concurrency (two
  # workers CAN race the same queue item, which one cannot) without doubling the
  # provider spend of every rehearsal.
  - target: { kind: Deployment, name: ida-llm-runner }
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 2
  # mock-model stays at base's replicas: 0 and MOCK_MODEL_BASE_URL stays "" —
  # staging deliberately inherits prod's behaviour here. Not patched, on purpose:
  # an explicit no-op patch would invite someone to "fix" it to match dev.
  - target: { kind: Ingress, name: ida-llm }
    patch: |-
      - op: replace
        path: /spec/rules/0/host
        value: ida-llm-staging.capstone.uamishub.com
      - op: replace
        path: /spec/tls/0/hosts
        value:
          - ida-llm-staging.capstone.uamishub.com
  # Same 5Gi total storage quota as dev.
  - target: { kind: PersistentVolumeClaim, name: ida-llm-object-store }
    patch: |-
      - op: replace
        path: /spec/resources/requests/storage
        value: 2Gi
  # ── RUN-EXECUTION AUTH ARMED (D-49 section 6) ─────────────────────────────
  # Gate `POST /runs` behind a bearer token; reads stay public (the public
  # results view is the product — docs/sensitive-material.md section 1). Scoped
  # to THIS overlay rather than base on purpose: base/deployments.yaml's
  # IDA_AUTH_TOKENS secretKeyRef is shared by ALL overlays, but dev + preview
  # never seed the Vault key (preview's ida-llm-secret is platform-owned and
  # carries only mock creds), so arming in base would park their api pods in
  # CreateContainerConfigError. staging + prod are the only envs that seed the
  # token, so the mode flag and the env ref live in those two overlays.
  #
  # ORDER AT SYNC: the Vault key must be seeded (see app-secret.externalsecret
  # .yaml) BEFORE this syncs. The ref is not `optional: true` and the api
  # refuses to boot under auth_mode=token with no tokens — both failures are
  # loud (CreateContainerConfigError / readiness fail), never a silent open gate.
  - target: { kind: ConfigMap, name: ida-llm-config }
    patch: |-
      - op: add
        path: /data/IDA_AUTH_MODE
        value: token
  # containers[0] on the api Deployment is `api` (its only container; `migrate`
  # is an initContainer). Append the token ref to that container's env.
  - target: { kind: Deployment, name: ida-llm-api }
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: IDA_AUTH_TOKENS
          valueFrom:
            secretKeyRef:
              name: ida-llm-secret
              key: IDA_AUTH_TOKENS
  # ── ADMIN CONSOLE WIRING, STILL DARK (admin-console design §7.2, PR C1) ──────
  # Secrets in, console OFF: ADMIN_CONSOLE_ENABLED is NOT set (C2/C3 flip it), and
  # IDA_CONFIG_SOURCE stays the code default `yaml`. With the console off the
  # frontend's /admin is a 404; the API's /admin needs the bearer only the
  # frontend pod holds. ORDER AT SYNC: the four Vault keys first (see
  # app-secret.externalsecret.yaml) -- the refs are not optional.
  - target: { kind: Deployment, name: ida-llm-api }
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: IDA_ADMIN_TOKENS
          valueFrom:
            secretKeyRef:
              name: ida-llm-secret
              key: IDA_ADMIN_TOKENS
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: IDA_CREDENTIALS_KEK
          valueFrom:
            secretKeyRef:
              name: ida-llm-secret
              key: IDA_CREDENTIALS_KEK
  - target: { kind: Deployment, name: ida-llm-runner }
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: IDA_CREDENTIALS_KEK
          valueFrom:
            secretKeyRef:
              name: ida-llm-secret
              key: IDA_CREDENTIALS_KEK
  # Only the judge-calibration sweep builds a model client (the judge); the two
  # enqueueing sweeps never decrypt anything, so they get no KEK.
  - target: { kind: CronJob, name: ida-llm-judge-calibration }
    patch: |-
      - op: add
        path: /spec/jobTemplate/spec/template/spec/containers/0/env/-
        value:
          name: IDA_CREDENTIALS_KEK
          valueFrom:
            secretKeyRef:
              name: ida-llm-secret
              key: IDA_CREDENTIALS_KEK
  - target: { kind: Deployment, name: ida-llm-frontend }
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: AUTH_SECRET
          valueFrom:
            secretKeyRef:
              name: ida-llm-secret
              key: AUTH_SECRET
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: AUTH_DEX_SECRET
          valueFrom:
            secretKeyRef:
              name: ida-llm-secret
              key: AUTH_DEX_SECRET
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: IDA_ADMIN_TOKENS
          valueFrom:
            secretKeyRef:
              name: ida-llm-secret
              key: IDA_ADMIN_TOKENS
  # AUTH_URL is the canonical origin Auth.js builds redirect URIs from; it MUST
  # equal this overlay's ingress host and a redirect URI on the Dex client. Move
  # the host, move this, and add the new URI to Dex -- together.
  - target: { kind: ConfigMap, name: ida-llm-config }
    patch: |-
      - op: add
        path: /data/AUTH_URL
        value: https://ida-llm-staging.capstone.uamishub.com
      # The Dex issuer and the ONE static client id (AD-14). Here and not in base
      # so preview -- which has no admin console and no redirect URI -- renders
      # no AUTH_* at all (chart-render asserts it).
      - op: add
        path: /data/AUTH_DEX_ISSUER
        value: https://id.capstone.uamishub.com
      - op: add
        path: /data/AUTH_DEX_ID
        value: ida-llm
      # ── C3: THE FLIP (admin-console design §11.3), staging ────────────────────
      # db: models, tasks and curriculum come from the database, seeded ONCE from
      # the image's YAML on first boot (content_sha preserved, so no score moves).
      # Rollback is one line: set this back to "yaml"; admin edits stay in the DB.
      - op: add
        path: /data/IDA_CONFIG_SOURCE
        value: db
      # The frontend serves /admin only when this is "true"; unset it is a 404.
      - op: add
        path: /data/ADMIN_CONSOLE_ENABLED
        value: "true"
      # Full task specs and transcripts need the author role. Flipped WITH the
      # two above: the public run page reads /tasks/{id}/meta (B6), and both
      # halves ship in the same images.
      - op: add
        path: /data/IDA_TASKS_SPEC_GATED
        value: "true"
