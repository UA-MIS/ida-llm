# staging overlay — the rehearsal for prod, so it uses REAL models.
#
# That is the deliberate difference from dev: dev's default is the mock (free,
# offline), staging's is the real provider. A staging that mocked its models
# would prove the deploy path and nothing about the thing the app exists to do,
# and the first real inference call would then happen in production.
#
# Written by the promotion seam: a `vX.Y.Z` tag build points BOTH images here at
# the same immutable tag. Nothing else writes this file.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: ida-llm-staging

resources:
  - ../../base
  - app-secret.externalsecret.yaml
  - database.externalsecret.yaml

labels:
  - pairs:
      platform.capstone/env: staging
      platform.capstone/semester: "2026-fall"
    includeSelectors: false

images:
  - name: ida-llm-frontend
    newName: harbor.capstone.uamishub.com/ida-llm/ida-llm-frontend
    newTag: "0.1.12"
  - name: ida-llm-python-app
    newName: harbor.capstone.uamishub.com/ida-llm/ida-llm-python-app
    newTag: "0.1.12"
  - name: ida-llm-agile
    newName: harbor.capstone.uamishub.com/ida-llm/ida-llm-agile
    newTag: "0.1.12"

patches:
  - target: { kind: Deployment, name: ida-llm-frontend }
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 1
  - target: { kind: Deployment, name: ida-llm-api }
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 1
  # Two runners, not prod's four: enough to exercise real concurrency (two
  # workers CAN race the same queue item, which one cannot) without doubling the
  # provider spend of every rehearsal.
  - target: { kind: Deployment, name: ida-llm-runner }
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 2
  # mock-model stays at base's replicas: 0 and MOCK_MODEL_BASE_URL stays "" —
  # staging deliberately inherits prod's behaviour here. Not patched, on purpose:
  # an explicit no-op patch would invite someone to "fix" it to match dev.
  - target: { kind: Ingress, name: ida-llm }
    patch: |-
      - op: replace
        path: /spec/rules/0/host
        value: ida-llm-staging.capstone.uamishub.com
      - op: replace
        path: /spec/tls/0/hosts
        value:
          - ida-llm-staging.capstone.uamishub.com
  # Same 5Gi total storage quota as dev.
  - target: { kind: PersistentVolumeClaim, name: ida-llm-object-store }
    patch: |-
      - op: replace
        path: /spec/resources/requests/storage
        value: 2Gi
  # ── RUN-EXECUTION AUTH ARMED (D-49 section 6) ─────────────────────────────
  # Gate `POST /runs` behind a bearer token; reads stay public (the public
  # results view is the product — docs/sensitive-material.md section 1). Scoped
  # to THIS overlay rather than base on purpose: base/deployments.yaml's
  # IDA_AUTH_TOKENS secretKeyRef is shared by ALL overlays, but dev + preview
  # never seed the Vault key (preview's ida-llm-secret is platform-owned and
  # carries only mock creds), so arming in base would park their api pods in
  # CreateContainerConfigError. staging + prod are the only envs that seed the
  # token, so the mode flag and the env ref live in those two overlays.
  #
  # ORDER AT SYNC: the Vault key must be seeded (see app-secret.externalsecret
  # .yaml) BEFORE this syncs. The ref is not `optional: true` and the api
  # refuses to boot under auth_mode=token with no tokens — both failures are
  # loud (CreateContainerConfigError / readiness fail), never a silent open gate.
  - target: { kind: ConfigMap, name: ida-llm-config }
    patch: |-
      - op: add
        path: /data/IDA_AUTH_MODE
        value: token
  # containers[0] on the api Deployment is `api` (its only container; `migrate`
  # is an initContainer). Append the token ref to that container's env.
  - target: { kind: Deployment, name: ida-llm-api }
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: IDA_AUTH_TOKENS
          valueFrom:
            secretKeyRef:
              name: ida-llm-secret
              key: IDA_AUTH_TOKENS
