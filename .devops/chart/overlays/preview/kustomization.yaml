# preview overlay — ephemeral per-PR environment.
#
# ⚠ CURRENTLY DORMANT, AND THAT IS A PLATFORM LIMIT, NOT AN OMISSION HERE.
# The tenant claim carries `previewEnabled: false` because the platform cannot
# fence a preview namespace yet: `<team>-pr-<n>` namespaces get no quota,
# LimitRange or NetworkPolicy from the Composition (so a preview would have MORE
# network reach than prod), the Vault AuthBackendRole binds the literal
# `ida-llm-preview` rather than `ida-llm-pr-<n>` so ESO 403s, and `harbor-pull` is
# explicitly not rendered for preview so every pod ImagePullBackOffs.
#
# This overlay is COMPLETE and render-tested anyway (chart-render.test.sh covers
# it) so that closing those platform gaps is a ONE-FIELD FLIP on the claim with
# ZERO changes in this repo. Do not delete it as dead code — it is the half of
# the contract this repo owns, already done.
#
# ⚠ THE `namespace:` BELOW IS A STAND-IN. The preview ApplicationSet overrides it
# per PR via `kustomize.namespace: ida-llm-pr-<n>`. The literal value here only
# makes the overlay renderable standalone (which is what lets CI test it).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: ida-llm-pr-1

resources:
  - ../../base
  # ⚠ NO SecretStore AND NO ExternalSecrets HERE, deliberately — unlike
  # dev/staging/prod. A preview's secrets (harbor-pull, ida-llm-secret,
  # ida-llm-db) are created by the PLATFORM-project guardrails Application
  # (platform-infra: applicationsets/ida-llm-preview-guardrails.yaml), not by
  # this chart.
  #
  # Two reasons, and both are the point rather than a convenience:
  #
  #  1. The per-tenant `vault-tenant` store CANNOT work in a per-PR namespace.
  #     It authenticates as the `eso-tenant` SA against the Vault k8s-auth role
  #     `tenant-ida-llm`, whose bound_service_account_namespaces is an EXACT LIST
  #     — the three env namespaces plus the literal `ida-llm-preview`. Not a glob,
  #     and provider-vault exposes no namespace-selector field, so `ida-llm-pr-7`
  #     can never be added declaratively.
  #  2. The platform's cluster-scoped store CAN reach any path under
  #     `secret/data/tenants/*`. That is precisely why a TENANT-owned manifest
  #     must not reference it: this repo could then point it at another team's
  #     subtree. Keeping those objects in platform-infra means the path is fixed
  #     by the platform.
  #
  # The upshot for a reviewer: a preview gets a throwaway in-namespace Postgres
  # and MOCK provider keys from a separate Vault path — it cannot touch the
  # team's database or spend real credits.

labels:
  - pairs:
      platform.capstone/env: preview
      platform.capstone/semester: "2026-fall"
    includeSelectors: false

# Preview tracks the PR head build: promotion.yaml maps preview → pull-<sha>, and
# the preview ApplicationSet sets each component's tag at sync time.
images:
  - name: ida-llm-frontend
    newName: harbor.capstone.uamishub.com/ida-llm/ida-llm-frontend
    newTag: preview
  - name: ida-llm-python-app
    newName: harbor.capstone.uamishub.com/ida-llm/ida-llm-python-app
    newTag: preview
  - name: ida-llm-agile
    newName: harbor.capstone.uamishub.com/ida-llm/ida-llm-agile
    newTag: preview

# ⚠ THE HPA IS REMOVED IN PREVIEWS, not just scaled down. Its minReplicas is 2,
# which would OVERRIDE the replicas:1 patch below and run two runners in every
# open PR's namespace — against a quota deliberately sized for one of everything.
# A preview is a review aid; there is nothing to autoscale.
patches:
  - target: { group: autoscaling, version: v2, kind: HorizontalPodAutoscaler, name: ida-llm-runner }
    patch: |-
      $patch: delete
      apiVersion: autoscaling/v2
      kind: HorizontalPodAutoscaler
      metadata:
        name: ida-llm-runner
  # Smallest possible footprint — one of everything.
  - target: { kind: Deployment, name: ida-llm-frontend }
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 1
  - target: { kind: Deployment, name: ida-llm-api }
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 1
  - target: { kind: Deployment, name: ida-llm-runner }
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 1
  # ── THE SAFETY SWITCH, ON — NON-NEGOTIABLE FOR PREVIEWS ──────────────────
  # A preview runs UNTRUSTED PR code. It must never be able to spend provider
  # credits or reach campus hardware, so the mock is up and it is the target.
  - target: { kind: Deployment, name: ida-llm-mock-model }
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 1
  - target: { kind: ConfigMap, name: ida-llm-config }
    patch: |-
      - op: replace
        path: /data/MOCK_MODEL_BASE_URL
        value: http://ida-llm-mock-model
      # The stub is the whole point of dev and preview: show it. Prod and staging
      # inherit base's `mock` and hide it from the public view.
      - op: replace
        path: /data/IDA_PUBLIC_HIDE_TAGS
        value: ""
  # ⚠ THE NIGHTLY SWEEPS ARE SUSPENDED IN PREVIEWS. Left running, every open PR
  # would fire three benchmark sweeps a night, against a namespace with no quota.
  # This is the single most expensive thing a preview could do by accident.
  - target: { kind: CronJob, name: ida-llm-rebenchmark }
    patch: |-
      - op: add
        path: /spec/suspend
        value: true
  - target: { kind: CronJob, name: ida-llm-model-sweep }
    patch: |-
      - op: add
        path: /spec/suspend
        value: true
  - target: { kind: CronJob, name: ida-llm-judge-calibration }
    patch: |-
      - op: add
        path: /spec/suspend
        value: true
  # Preview host carries the PR number; the ApplicationSet substitutes <n>.
  - target: { kind: Ingress, name: ida-llm }
    patch: |-
      - op: replace
        path: /spec/rules/0/host
        value: ida-llm-pr-1.capstone.uamishub.com
      - op: replace
        path: /spec/tls/0/hosts
        value:
          - ida-llm-pr-1.capstone.uamishub.com
  # Tiny volumes — a preview stores nothing worth keeping.
  - target: { kind: PersistentVolumeClaim, name: ida-llm-object-store }
    patch: |-
      - op: replace
        path: /spec/resources/requests/storage
        value: 1Gi
