# Per-namespace ESO SecretStore + ServiceAccount for a PREVIEW namespace only.
#
# dev/staging/prod do NOT ship this — the CapstoneTenant Composition creates both
# objects there, and a second copy would be dual-owned and fight Crossplane. A
# per-PR namespace is created by ArgoCD instead of Crossplane, so nothing else
# puts them there and this overlay must.
#
# ⚠ THIS IS ALSO WHY PREVIEWS ARE BLOCKED TODAY. Creating the SA is necessary but
# not sufficient: the Vault k8s-auth role `tenant-ida-llm` lists its bound
# ServiceAccount NAMESPACES explicitly — the three env namespaces plus the literal
# `ida-llm-preview` — and that list is not a glob. So `ida-llm-pr-7`'s eso-tenant
# SA authenticates and is refused. Fixing it means the Composition must bind
# `<team>-pr-*`, which the Vault k8s auth method cannot express as a wildcard;
# the platform's own preview blockers (B1/B2) track the real solution.
#
# ⚠ vault-ca is ALSO missing in a preview namespace. A namespaced SecretStore
# cannot reference a ConfigMap in another namespace, and the Composition only
# materializes `vault-ca` in the three env namespaces — so even with the role
# fixed, the CA lookup below would fail until that is addressed too.
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: eso-tenant
  labels:
    app.kubernetes.io/name: ida-llm
    platform.capstone/component: tenant
---
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: vault-tenant
  labels:
    app.kubernetes.io/name: ida-llm
    platform.capstone/component: tenant
spec:
  provider:
    vault:
      server: "https://vault.vault.svc.cluster.local:8200"
      # KV v2 engine mounted at `secret`; ESO appends the v2 `/data` segment.
      path: "secret"
      version: "v2"
      caProvider:
        type: ConfigMap
        name: vault-ca
        key: ca.crt
      auth:
        kubernetes:
          mountPath: "kubernetes"
          role: "tenant-ida-llm"
          serviceAccountRef:
            name: eso-tenant
            audiences:
              - vault
