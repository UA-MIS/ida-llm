# DATABASE_URL for preview, assembled from the auto-provisioned Postgres credentials.
#
# The CapstoneTenant Composition (database: postgres) creates database + login
# role `ida_llm_preview` on the in-cluster PG17 tenant DB tier and PushSecrets
# exactly FOUR properties to Vault: username, password, host, port.
#
# ⚠ THE DATABASE NAME IS NOT IN VAULT — it is structural (<team with - as _>_<env>),
# so the DSN is assembled here in target.template rather than stored whole. If the
# tenant slug ever changes, this literal must change with it.
#
# ⚠ SCHEME IS postgresql://, NOT mysql://. This is the ONE line that differs from
# the MySQL tenants' otherwise identical file — the Composition writes the same
# four properties for both engines precisely so the rest of this contract is
# engine-agnostic.
#
# Nothing here is a secret value: this is a path + a template. ESO resolves it.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ida-llm-db
  labels:
    app.kubernetes.io/name: ida-llm
spec:
  refreshInterval: "1h"
  secretStoreRef:
    name: vault-tenant
    kind: SecretStore
  target:
    name: ida-llm-db
    creationPolicy: Owner
    deletionPolicy: Delete
    template:
      engineVersion: v2
      data:
        DATABASE_URL: "postgresql://{{ .username }}:{{ .password }}@{{ .host }}:{{ .port }}/ida_llm_preview"
  data:
    - secretKey: username
      remoteRef: { key: tenants/ida-llm/preview/database, property: username }
    - secretKey: password
      remoteRef: { key: tenants/ida-llm/preview/database, property: password }
    - secretKey: host
      remoteRef: { key: tenants/ida-llm/preview/database, property: host }
    - secretKey: port
      remoteRef: { key: tenants/ida-llm/preview/database, property: port }
