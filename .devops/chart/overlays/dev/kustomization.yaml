# dev overlay. This is the file the promotion seam WRITES: bump-image.sh and
# promote.sh rewrite every `images[].newTag` below in one pass, so both
# components always move together. promote.sh refuses outright if they ever
# disagree, which is what makes "promote what is running in staging" atomic.
#
# newTag starts at the v0.0.0 SENTINEL. No build ever produces v0.0.0 — it marks
# "never deployed". seed-initial-envs.sh replaces it on the FIRST main build so
# staging and prod come up green out of the box, then becomes a permanent no-op,
# leaving them promotion-gated from that point on.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: ida-llm-dev

resources:
  - ../../base
  - app-secret.externalsecret.yaml
  - database.externalsecret.yaml

labels:
  - pairs:
      platform.capstone/env: dev
      platform.capstone/semester: "2026-fall"
    includeSelectors: false

images:
  - name: ida-llm-frontend
    newName: harbor.capstone.uamishub.com/ida-llm/ida-llm-frontend
    newTag: "0dd0e03"
  - name: ida-llm-python-app
    newName: harbor.capstone.uamishub.com/ida-llm/ida-llm-python-app
    newTag: "0dd0e03"
  - name: ida-llm-agile
    newName: harbor.capstone.uamishub.com/ida-llm/ida-llm-agile
    newTag: "0dd0e03"

patches:
  # Replicas are JSON6902 patches, NOT the kustomize builtin `replicas:`
  # transformer — the builtin errors on non-Deployment workload GVKs, and this
  # chart contains a StatefulSet and (later) possibly a Rollout.
  - target: { kind: Deployment, name: ida-llm-frontend }
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 1
  - target: { kind: Deployment, name: ida-llm-api }
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 1
  - target: { kind: Deployment, name: ida-llm-runner }
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 1
  # ── THE SAFETY SWITCH, ON ────────────────────────────────────────────────
  # dev runs the mock model endpoint and POINTS AT IT. Real provider keys still
  # exist in dev's Vault path, so a developer can deliberately switch a run to a
  # cloud model — but the DEFAULT costs nothing and touches no campus hardware.
  # Both halves are required: scaling the pod up without setting the URL leaves
  # the mock idle, and setting the URL without the pod gives connection refused.
  - target: { kind: Deployment, name: ida-llm-mock-model }
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 1
  - target: { kind: ConfigMap, name: ida-llm-config }
    patch: |-
      - op: replace
        path: /data/MOCK_MODEL_BASE_URL
        value: http://ida-llm-mock-model
      # The stub is the whole point of dev and preview: show it. Prod and staging
      # inherit base's `mock` and hide it from the public view.
      - op: replace
        path: /data/IDA_PUBLIC_HIDE_TAGS
        value: ""
      # ── DEV-ONLY REGISTRY OVERRIDE ──────────────────────────────────────────
      # Point the API/runner at the dev registry (real entries + synthetic demo
      # models) so the dev site shows the ~7-model populated grid. Set ONLY here:
      # staging and prod never set IDA_MODELS_FILE, load /app/models.yaml, and
      # never see a demo key. (Settings.resolved_models_file reads this.)
      - op: add
        path: /data/IDA_MODELS_FILE
        value: /app/models.dev.yaml
      # The dev-only curriculum: a majors taxonomy that gives real classes demo
      # task_families, a coverage map with the two extra MIS classes, and the
      # union task catalogue (real + synthetic demo families). All ship in the
      # image but are read ONLY here — staging/prod leave these unset and load
      # the committed models.yaml / curriculum / tasks, so zero demo curriculum
      # structure reaches their effective output. (Settings.resolved_*_file /
      # resolved_tasks_dir read these.)
      - op: add
        path: /data/IDA_MAJORS_FILE
        value: /app/curriculum/majors.dev.yaml
      - op: add
        path: /data/IDA_CURRICULUM_FILE
        value: /app/curriculum/slo.dev.yaml
      # The unit taxonomy's dev twin (real + demo classes). Units moved out of
      # the frontend (admin-console AD-11) and are served on /curriculum, so the
      # demo units now arrive the same way the demo majors do.
      - op: add
        path: /data/IDA_UNITS_FILE
        value: /app/curriculum/units.dev.yaml
      - op: add
        path: /data/IDA_TASKS_DIR
        value: /app/tasks-all
      # The frontend gate for the demo UNIT taxonomy (lib/units.ts). Load-bearing,
      # not cosmetic: the demo classes also exist in the real majors.yaml, so
      # without this flag off in prod their unit titles would render against the
      # real (unmeasured) classes there.
      - op: add
        path: /data/IDA_DEMO_CURRICULUM
        value: "1"
      # Defense-in-depth: demo models are tagged `demonstration`. Dev sweeps are
      # suspended (D-43), but if one ever ran it would otherwise produce REAL
      # (unflagged) runs for fictional models. Excluding the tag keeps a sweep
      # from ever scoring a demo model outside the demonstration-flagged seed.
      # `testing-only` (the default, which holds luna back) is kept.
      - op: add
        path: /data/IDA_SWEEP_EXCLUDE_TAGS
        value: testing-only,demonstration
  # Public host for this env. Single-label under capstone.uamishub.com — the
  # Cloudflare Universal SSL wildcard covers exactly one level (see
  # base/ingress.yaml). Both the rule AND the tls.hosts list must be patched or
  # the cert/SNI and the router disagree.
  - target: { kind: Ingress, name: ida-llm }
    patch: |-
      - op: replace
        path: /spec/rules/0/host
        value: ida-llm-dev.capstone.uamishub.com
      - op: replace
        path: /spec/tls/0/hosts
        value:
          - ida-llm-dev.capstone.uamishub.com
  # dev's `requests.storage` quota is 5Gi TOTAL and the redis volumeClaimTemplate
  # already takes 1Gi of it, so the prod-sized 10Gi claim in base would leave
  # redis unable to bind — with the confusing symptom being redis, not this.
  - target: { kind: PersistentVolumeClaim, name: ida-llm-object-store }
    patch: |-
      - op: replace
        path: /spec/resources/requests/storage
        value: 2Gi
  # ── ADMIN CONSOLE WIRING, STILL DARK (admin-console design §7.2, PR C1) ──────
  # Secrets in, console OFF: ADMIN_CONSOLE_ENABLED is NOT set (C2/C3 flip it), and
  # IDA_CONFIG_SOURCE stays the code default `yaml`. With the console off the
  # frontend's /admin is a 404; the API's /admin needs the bearer only the
  # frontend pod holds. ORDER AT SYNC: the four Vault keys first (see
  # app-secret.externalsecret.yaml) -- the refs are not optional.
  - target: { kind: Deployment, name: ida-llm-api }
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: IDA_ADMIN_TOKENS
          valueFrom:
            secretKeyRef:
              name: ida-llm-secret
              key: IDA_ADMIN_TOKENS
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: IDA_CREDENTIALS_KEK
          valueFrom:
            secretKeyRef:
              name: ida-llm-secret
              key: IDA_CREDENTIALS_KEK
  - target: { kind: Deployment, name: ida-llm-runner }
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: IDA_CREDENTIALS_KEK
          valueFrom:
            secretKeyRef:
              name: ida-llm-secret
              key: IDA_CREDENTIALS_KEK
  # Only the judge-calibration sweep builds a model client (the judge); the two
  # enqueueing sweeps never decrypt anything, so they get no KEK.
  - target: { kind: CronJob, name: ida-llm-judge-calibration }
    patch: |-
      - op: add
        path: /spec/jobTemplate/spec/template/spec/containers/0/env/-
        value:
          name: IDA_CREDENTIALS_KEK
          valueFrom:
            secretKeyRef:
              name: ida-llm-secret
              key: IDA_CREDENTIALS_KEK
  - target: { kind: Deployment, name: ida-llm-frontend }
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: AUTH_SECRET
          valueFrom:
            secretKeyRef:
              name: ida-llm-secret
              key: AUTH_SECRET
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: AUTH_DEX_SECRET
          valueFrom:
            secretKeyRef:
              name: ida-llm-secret
              key: AUTH_DEX_SECRET
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: IDA_ADMIN_TOKENS
          valueFrom:
            secretKeyRef:
              name: ida-llm-secret
              key: IDA_ADMIN_TOKENS
  # AUTH_URL is the canonical origin Auth.js builds redirect URIs from; it MUST
  # equal this overlay's ingress host and a redirect URI on the Dex client. Move
  # the host, move this, and add the new URI to Dex -- together.
  - target: { kind: ConfigMap, name: ida-llm-config }
    patch: |-
      - op: add
        path: /data/AUTH_URL
        value: https://ida-llm-dev.capstone.uamishub.com
      # The Dex issuer and the ONE static client id (AD-14). Here and not in base
      # so preview -- which has no admin console and no redirect URI -- renders
      # no AUTH_* at all (chart-render asserts it).
      - op: add
        path: /data/AUTH_DEX_ISSUER
        value: https://id.capstone.uamishub.com
      - op: add
        path: /data/AUTH_DEX_ID
        value: ida-llm
      # ── C2: THE FLIP (admin-console design §11.3), dev first ──────────────────
      # db: models, tasks and curriculum come from the database, seeded ONCE from
      # the image's YAML on first boot (content_sha preserved, so no score moves).
      # Rollback is one line: set this back to "yaml"; admin edits stay in the DB.
      - op: add
        path: /data/IDA_CONFIG_SOURCE
        value: db
      # The frontend serves /admin only when this is "true"; unset it is a 404.
      - op: add
        path: /data/ADMIN_CONSOLE_ENABLED
        value: "true"
      # Full task specs and transcripts need the author role. Flipped WITH the
      # two above: the public run page reads /tasks/{id}/meta (B6), and both
      # halves ship in the same images.
      - op: add
        path: /data/IDA_TASKS_SPEC_GATED
        value: "true"
