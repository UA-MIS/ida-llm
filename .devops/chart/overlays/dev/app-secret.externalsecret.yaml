# App secrets for dev, materialized by ESO from the team's Vault subtree.
#
# NOTHING SECRET IS IN GIT. This file names Vault paths and property keys only;
# the values are seeded out-of-band by the operator with
#   vault kv put secret/tenants/ida-llm/dev/app KEY=...
# Until that happens this ExternalSecret sits SecretSyncError and the pods stay in
# CreateContainerConfigError — a LOUD, correct failure mode. The secretKeyRefs in
# the chart are deliberately NOT `optional: true`, so a pod can never boot
# silently mis-configured (the env-injection race: a pod that starts before ESO
# writes the Secret keeps its unresolved env for the life of the container).
#
# The SecretStore `vault-tenant` and its `eso-tenant` ServiceAccount are NOT
# declared here: the CapstoneTenant Composition already creates both in every env
# namespace. Shipping our own copies would make them dual-owned and fight
# Crossplane. We only reference the store by name.
#
# Vault role tenant-ida-llm grants read on secret/data/tenants/ida-llm/*, so
# adding keys under this path needs no policy change.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ida-llm-secret
  labels:
    app.kubernetes.io/name: ida-llm
spec:
  refreshInterval: "1h"
  secretStoreRef:
    name: vault-tenant
    kind: SecretStore
  target:
    name: ida-llm-secret
    creationPolicy: Owner
    deletionPolicy: Delete
  data:
    # MinIO credentials. These are BOTH the client creds (api + runner read/write
    # artifacts) AND the root creds of the in-namespace MinIO — one value, one
    # source of truth, no drift.
    - secretKey: MINIO_ACCESS_KEY
      remoteRef: { key: tenants/ida-llm/dev/app, property: MINIO_ACCESS_KEY }
    - secretKey: MINIO_SECRET_KEY
      remoteRef: { key: tenants/ida-llm/dev/app, property: MINIO_SECRET_KEY }
    # Cloud model provider keys. PER-ENVIRONMENT on purpose: a dev key that leaks
    # must not be spendable against the production budget, and per-env keys make
    # provider-side spend attributable to an environment.
    - secretKey: ANTHROPIC_API_KEY
      remoteRef: { key: tenants/ida-llm/dev/app, property: ANTHROPIC_API_KEY }
    - secretKey: OPENAI_API_KEY
      remoteRef: { key: tenants/ida-llm/dev/app, property: OPENAI_API_KEY }
    # Campus vLLM ("Sparks") credential. Seeded as a placeholder today — the
    # cluster egress policy does not open a route to Sparks yet (deferred by owner
    # decision). Present so that turning Sparks on later is a Vault write plus one
    # netpol block, with no manifest change.
    - secretKey: SPARKS_API_KEY
      remoteRef: { key: tenants/ida-llm/dev/app, property: SPARKS_API_KEY }
