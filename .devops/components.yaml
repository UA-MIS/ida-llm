# components.yaml — the deployable components in THIS repo (multi-component
# contract, platform.capstone/v1). One repo → N images, ONE shared tag.
#
# Two consumers:
#   - .devops/ci/resolve-components.sh → the CI build matrix (one Kaniko leg per
#     entry), consumed by .github/workflows/build-and-push.yaml
#   - .devops/chart/base/* → the Deployments and Services that reference them
#
# ⚠ TWO IMAGES, SIX WORKLOADS. This file lists what is BUILT, not what RUNS. The
# python image serves four roles by argv (api, runner, mock-model, and the three
# CronJobs); the chart is where that fan-out lives. Adding a Deployment that
# reuses an existing image does NOT belong here — adding a new *build* does.
#
# ⚠ EVERY component's `context` is the REPO ROOT (`.`). The python distributions
# depend on each other across packages/ and services/, and the frontend build is
# kept on the same root so ONE .dockerignore governs both and a future shared
# package is reachable without moving anything. `dockerfile` is therefore the
# full repo-relative path.
#
# `path` is the Ingress path this component serves. ONLY the frontend is routed
# publicly; api, runner, mock-model, redis and the object store are
# cluster-internal and carry `path: ""` — the chart gives them no Ingress rule.
# That is a deliberate boundary: the api has no public route at all, so its
# surface is reachable only from inside the namespace.
apiVersion: platform.capstone/v1
components:
  # frontend — the public results UI (Next.js 15 standalone).
  - name: frontend
    kind: frontend
    context: .
    dockerfile: frontend/Dockerfile
    image: ida-llm-frontend
    port: 3000
    path: /
    needsDb: false
    buildType: container

  # python-app — ONE build, FOUR runtime roles (ida-api / ida-runner /
  # ida-mock-model / ida-sweep). `port` is the api role's listener, which is what
  # the chart probes for that Deployment; the other roles set their own.
  #
  # needsDb: true — the api role reads DATABASE_URL and the migration
  # initContainer runs Alembic from this same image, so schema and code can never
  # be out of step.
  - name: python-app
    kind: backend
    context: .
    dockerfile: Dockerfile.python
    image: ida-llm-python-app
    port: 8000
    path: ""
    needsDb: true
    buildType: container

  # agile — the ADO-style sprint board (apps/agile). PROD ONLY, single replica,
  # and the ONE component with an EXPLICIT host (ida-agile.capstone.uamishub.com)
  # instead of the <app>-<env> pattern.
  #
  # `path: ""` because it does not serve a path on the main app's host — it gets
  # its own host rule on the same Ingress OBJECT. Same object on purpose: the
  # platform's env ApplicationSet attaches the non-prod SSO forwardAuth by
  # targeting `kind: Ingress, name: ida-llm`, so a second Ingress would silently
  # receive no gate. Harmless here (prod is never gated) and correct if it ever
  # gains a non-prod presence.
  #
  # needsDb: true — its own `agile` SCHEMA inside the SAME tenant database, not a
  # second database. The XRD provisions one engine per tenant, and a second claim
  # for the same team would fight the first over the same namespaces.
  - name: agile
    kind: backend
    context: .
    dockerfile: apps/agile/Dockerfile
    image: ida-llm-agile
    port: 8080
    path: ""
    needsDb: true
    buildType: container
