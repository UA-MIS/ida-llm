  # --- OpenAI (chat completions) -------------------------------------------
  #
  # serving_stack: openai_api takes the default OpenAICompatibleClient -- the
  # same one the mock model and campus vLLM use. Nothing about OpenAI is
  # special-cased; it is simply the endpoint the client was written against.
  #
  # ⚠ max_tokens. This client sends `max_tokens`, which OpenAI has deprecated in
  # favour of `max_completion_tokens` and which the o-series REJECTS outright:
  #     "Unsupported parameter: 'max_tokens' is not supported with this model.
  #      Use 'max_completion_tokens' instead."
  # That error now reaches the operator verbatim. Prefer a non-reasoning chat
  # model here until the harness can send either name (see docs/model-clients.md
  # -- deliberately NOT guessed at, because the exact set of affected models is
  # not documented and inventing the boundary would be worse than the gap).
  # Reasoning models also reject a non-default temperature/top_p.
