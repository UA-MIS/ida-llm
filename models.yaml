# The model registry (D-1).
#
# Every model -- a hosted commercial API, a campus vLLM deployment, a laptop
# llama.cpp server -- is an OpenAI-compatible endpoint described by a base URL,
# the NAME of an env var holding its key, and a serving config. Adding a model
# is an edit to this file. There is no per-provider code anywhere.
#
# SECRETS ARE NEVER IN THIS FILE. `api_key_env` names an environment variable;
# in-cluster that variable is projected from Vault, locally it comes from .env.
#
# Validated in CI against packages/core/ida_core/schemas/models.schema.json.
version: 1

models:
  # --- the only entry enabled by default -----------------------------------
  # The tracer bullet, every test and `make dev` run against this. No key, no
  # GPU, no network egress, deterministic answers.
  - key: mock
    display_name: Mock model (deterministic)
    base_url: http://mock-model:8000/v1
    api_key_env: null
    enabled: true
    timeout_s: 30
    max_retries: 2
    tags: [mock, ci, tracer]
    serving:
      model_id: mock-echo-1
      serving_stack: mock
      serving_version: ida-mock-model 0.1.0
      quantization: none
      context_window: 8192
      hardware: null
      sampling:
        temperature: 0.0
        top_p: 1.0
        max_tokens: 256
        seed: 20260101
    cost:
      input_usd_per_mtok: 0.0
      output_usd_per_mtok: 0.0

  # --- EXAMPLES: uncomment and fill in when the real endpoints exist --------
  #
  # A hosted commercial API. Anthropic exposes an OpenAI-compatible surface, so
  # it needs no special-casing -- only a base URL, a key env var and honest
  # metadata. Note quantization: unknown -- we are not told, and recording
  # `none` would be a fabricated measurement.
