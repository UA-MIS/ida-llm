# The model registry (D-13 -- the reproducibility decision;
# the D-1..D-12 entries in the decision log are empty stubs).
#
# Every model -- a hosted commercial API, a campus vLLM deployment, a laptop
# llama.cpp server -- is described by a base URL, the NAME of an env var holding
# its key, and a serving config. Adding a model is an edit to THIS FILE and
# nothing else: `serving.serving_stack` selects the client that will answer
# (packages/harness/ida_harness/factory.py), so a new vLLM box or a new hosted
# model needs no code change at all.
#
# Three clients exist, because three wire formats exist:
#
#   anthropic_compat  -> the Anthropic Messages API (x-api-key, `system` hoisted
#                        out of `messages`, `content` as a block list)
#   openai_reasoning  -> chat-completions as the o-series and the GPT-5/5.4/5.5/
#                        5.6 families speak it: `max_completion_tokens` instead
#                        of `max_tokens` (which they reject outright), and only
#                        the API-default temperature/top_p
#   everything else   -> OpenAI-compatible POST {base_url}/chat/completions
#
# None contains an `if provider == ...`; the table in factory.py is the one
# place a provider is named. See docs/model-clients.md for why the Messages API
# is used directly rather than through Anthropic's compatibility shim, and why
# the reasoning dialect is a separate stack rather than a flag.
#
# SECRETS ARE NEVER IN THIS FILE. `api_key_env` names an environment variable;
# in-cluster that variable is projected from Vault, locally it comes from .env.
#
# NEITHER IS A PER-ENVIRONMENT ENDPOINT. `base_url_env` names a variable that
# OVERRIDES `base_url` when it is set and non-empty. That indirection is the
# credit/hardware SAFETY SWITCH, and it has to exist because ONE image is
# promoted byte-identically from dev to staging to prod: `MOCK_MODEL_BASE_URL`
# is patched per overlay -- the in-cluster stub in dev and preview, EMPTY in
# staging and prod -- and .devops/ci/chart-render.test.sh asserts both
# directions. A literal base_url alone would make that patch a no-op.
#
# THE JUDGE IS JUST AN ENTRY IN THIS FILE. Subjective tasks are graded by an
# LLM judge (packages/harness/ida_harness/judge.py), and "which model judges" is
# `IDA_JUDGE_MODEL_KEY` naming a key below -- any key, any serving stack. There
# is no judge-specific provider branch anywhere in the codebase, and no default:
# unset means subjective tasks stay unscored with their transcripts archived,
# rather than every run quietly starting to spend money. See the JUDGE example
# at the bottom of this file and docs/llm-judge.md.
#
# Validated in CI against packages/core/ida_core/schemas/models.schema.json.
version: 1

models:
  # --- the only FREE entry, and the only one CI and `make dev` ever reach ---
  # The tracer bullet, every test and `make dev` run against this. No key, no
  # GPU, no network egress, deterministic answers.
  #
  # `luna` below is also enabled -- deliberately, on a $25 test budget -- but
  # nothing local can reach it: OPENAI_API_KEY is unset on dev boxes and in CI,
  # so selecting it there fails loudly on the missing key rather than spending.
  #
  # It also answers the JUDGE protocol deterministically, so
  # `IDA_JUDGE_MODEL_KEY=mock` exercises the whole subjective path locally
  # without a key or a cent. Its grades are a hash of the criterion name and
  # mean nothing about the response -- which is the point: they are for testing
  # the PLUMBING, and a mock judge whose numbers looked meaningful would be far
  # more dangerous than one that obviously does not.
  - key: mock
    display_name: Mock model (deterministic)
    base_url_env: MOCK_MODEL_BASE_URL   # in-cluster: http://ida-llm-mock-model (dev/preview), "" elsewhere
    base_url: http://mock-model:8000/v1 # fallback: the docker-compose service
    api_key_env: null
    enabled: true
    timeout_s: 30
    max_retries: 2
    tags: [mock, ci, tracer]
    serving:
      model_id: mock-echo-1
      serving_stack: mock
      serving_version: ida-mock-model 0.1.0
      quantization: none
      context_window: 8192
      hardware: null
      sampling:
        temperature: 0.0
        top_p: 1.0
        max_tokens: 256
        seed: 20260101
    cost:
      input_usd_per_mtok: 0.0
      output_usd_per_mtok: 0.0

  # --- "Luna" (OpenAI GPT-5.6 Luna), ENABLED -- TESTING ONLY, $25 HARD CAP --
  #
  # THE ONLY HOSTED MODEL THAT MAY BE ENABLED IN THIS FILE. The guard test
  # `test_only_the_mock_is_enabled` in packages/harness/tests/
  # test_registry_examples.py allows exactly {mock, luna} and fails the PR that
  # enables anything else. Read that test before adding a second one.
  #
  # ⚠ WHAT THE BUDGET IS. The key behind OPENAI_API_KEY is scoped to this model
  # and carries a $25 HARD CAP, enforced OpenAI-side. It exists so the real
  # provider path can be exercised end to end -- it is NOT the finished
  # product's budget. The cap is a backstop against a mistake, not an allowance
  # to spend.
  #
  # ⚠ ENABLED DOES NOT MEAN SWEPT, AND THAT IS ENFORCED. Both nightly sweeps
  # plan over the ENABLED set, so on its own `enabled: true` would have signed
  # this entry up for a full unattended suite every night -- `model-sweep`
  # especially, whose whole job is giving a NEWLY enabled model its first set of
  # numbers. The `testing-only` tag below is what holds it back, via
  # IDA_SWEEP_EXCLUDE_TAGS (default "testing-only"); see
  # `sweepable_model_keys` in services/runner/ida_runner/sweeps.py. A sweep that
  # holds a model back SAYS SO in its report. Removing that tag, or clearing the
  # setting, schedules real spend -- do the arithmetic first
  # (docs/calibration.md).
  #
  # ⚠ WHY serving_stack IS `openai_reasoning` AND NOT `openai_api`. Luna is a
  # GPT-5.6 model, and that family REJECTS the legacy `max_tokens` with
  #     "Unsupported parameter: 'max_tokens' is not supported with this model.
  #      Use 'max_completion_tokens' instead."
  # The plain OpenAI-compatible client sends `max_tokens`, so this entry served
  # by `openai_api` would 400 on every single call. `openai_reasoning` selects
  # OpenAIReasoningClient, which sends `max_completion_tokens` instead. That is
  # a WIRE FORMAT difference, which is exactly what serving_stack selects --
  # adding this model was still a YAML edit plus one client subclass, and no
  # code anywhere names "luna" or "gpt-5.6". See docs/model-clients.md.
  #
  # ⚠ SAMPLING IS NOT PINNABLE HERE, AND THAT IS A PROPERTY OF THE MODEL.
  # Reasoning models accept only OpenAI's default temperature/top_p of 1.0; a
  # non-default value is a 400. So the benchmark default of 0.0 CANNOT be used,
  # and Luna's outputs are not greedy-decoded. Runs against this entry are
  # therefore NOT bit-reproducible the way a mock or a seeded vLLM run is, and
  # comparing a Luna number to a temperature-0.0 number is comparing two
  # different things. preflight warns if anyone edits these back to 0.0.
  #
  # ⚠ THE OUTPUT CAP IS SHARED WITH THINKING. `max_completion_tokens` bounds
  # visible output tokens PLUS reasoning tokens. Set it too low and the model
  # spends the whole budget thinking and returns an EMPTY answer that a scorer
  # would happily grade 0.0 -- a fabricated measurement. 4096 is chosen to leave
  # real headroom for short-answer tasks; OpenAIReasoningClient additionally
  # refuses to return an empty completion that stopped on `length`, so this
  # fails loudly rather than scoring zero. Raising it raises the worst-case
  # cost per sample linearly: see docs/calibration.md for the arithmetic.
  #
  # ⚠ PRICING retrieved 2026-08-27 from
  # developers.openai.com/api/docs/models/gpt-5.6-luna. Standard (short-context)
  # tier. Two caveats, both of which make the RECORDED cost an OVER-estimate
  # rather than an under-estimate, which is the safe direction:
  #   * prompts over 272K input tokens bill at 2x input / 1.5x output for the
  #     whole request. Nothing in tasks/ comes close, so the standard rate is
  #     the honest one here -- but a long-context task would silently be
  #     under-recorded, so do not author one against this entry.
  #   * OpenAI caches prompt prefixes automatically at $0.02/Mtok. TokenUsage
  #     does not split `cached_tokens` out of `prompt_tokens`, so cached input
  #     is billed here at the full rate. Real spend is <= recorded spend.
  - key: luna
    display_name: Luna (OpenAI GPT-5.6 Luna) -- test budget, $25 cap
    base_url: https://api.openai.com/v1
    api_key_env: OPENAI_API_KEY         # Vault: secret/tenants/ida-llm/<env>/app
                                        # -> Secret `ida-llm-secret`. See
                                        # docs/provider-keys.md. NOT set on dev
                                        # boxes, deliberately.
    enabled: true
    timeout_s: 180                      # reasoning models are slow to first token;
                                        # 120 (the old example) times out under load
    max_retries: 4
    tags: [cloud, openai, reasoning, testing-only, budget-capped]
    serving:
      model_id: gpt-5.6-luna            # exact id sent in the body
      serving_stack: openai_reasoning
      serving_version: null             # provider does not report one; the
                                        # per-response `system_fingerprint` is
                                        # in the archived raw response
      quantization: unknown             # hosted APIs never tell us
      revision: null                    # no snapshot pinning offered
      context_window: 1050000           # provider states 1,050,000 total;
                                        # 922,000 max input, 128,000 max output
      hardware: null
      sampling:
        temperature: 1.0                # the ONLY accepted value -- see above
        top_p: 1.0                      # ditto
        max_tokens: 4096                # sent as `max_completion_tokens`;
                                        # shared with reasoning tokens
        seed: null                      # accepted by the API but best-effort at
                                        # most, and thinking is not replayable:
                                        # recording one would imply a
                                        # reproducibility this entry lacks
    cost:
      input_usd_per_mtok: 0.20
      output_usd_per_mtok: 1.20

  # --- campus vLLM ("Sparks"), DEFERRED AND DISABLED ------------------------
  #
  # Present, wired and off. `SPARKS_BASE_URL` is empty in every environment: the
  # tenant egress policy opens :443 to the internet and opens NO ROUTE to campus
  # hardware (deliberately -- see infra/inference/README.md, which names the
  # exact netpol block and the three ways to get it wrong).
  #
  # Because the endpoint is env-indirect and there is no literal fallback,
  # selecting this entry today fails immediately with "SPARKS_BASE_URL is unset
  # or empty" rather than hanging on a connect timeout to a host that is not
  # routable. Turning it on is a value in Vault plus one netpol block -- no code
  # change and no edit to this file.
  #
  # ⚠ The CronJob sweeps receive ANTHROPIC_API_KEY and OPENAI_API_KEY but NOT
  # SPARKS_API_KEY. A nightly sweep that selects this model fails on an unset key
  # before it reaches the (correct) "no route" error.
  - key: sparks-local
    display_name: Campus vLLM (Sparks) -- deferred
    base_url_env: SPARKS_BASE_URL
    base_url: ""                        # no fallback ON PURPOSE: fail loudly, never guess
    api_key_env: SPARKS_API_KEY
    enabled: false
    timeout_s: 300                      # local models are slower to first token
    max_retries: 3
    tags: [local, campus, open-weights, deferred]
    serving:
      model_id: TODO-PLACEHOLDER-sparks-model-id
      serving_stack: vllm
      serving_version: null             # TODO-PLACEHOLDER(vllm-version): pin at deploy time
      quantization: unknown             # knowable once the endpoint exists; not guessed now
      revision: null
      context_window: 32768
      hardware: 1x DGX Spark GB10 128GB unified
      sampling:
        temperature: 0.0
        top_p: 1.0
        max_tokens: 2048
        seed: 20260101                  # vLLM honours seed; hosted APIs mostly do not
    cost:
      input_usd_per_mtok: 0.0           # self-hosted: no per-token cost
      output_usd_per_mtok: 0.0

  # --- EXAMPLES: uncomment when there are credits and a tag to run them ----
  #
  # These are accurate for the clients that are actually implemented -- copy,
  # uncomment, and check the pricing line before you spend anything.
  #
  # ⚠ PRICING IS AUTHORED HERE, NEVER IN CODE. `cost.input_usd_per_mtok` and
  # `cost.output_usd_per_mtok` are USD per MILLION tokens; the harness multiplies
  # them by the token counts the PROVIDER reported (never an estimate) in
  # TokenUsage.cost_usd, and stamps the result on every ResultRecord. A wrong
  # number here is a wrong number in the database, so the retrieval date is part
  # of the record.

  # --- Anthropic (Messages API) --------------------------------------------
  #
  # serving_stack: anthropic_compat selects AnthropicMessagesClient. The base URL
  # keeps its /v1 -- the client appends /messages.
  #
  # ⚠ SAMPLING. Anthropic's defaults are temperature 1.0 and top_p 1.0, and the
  # client OMITS a parameter that is already at its default (which is honest --
  # the endpoint then uses exactly the value recorded here). Current Claude
  # models -- Opus 5, Sonnet 5, Opus 4.8/4.7 -- REJECT a non-default temperature
  # or top_p with a 400, and Claude 4.x also rejects both being sent together.
  # So: temperature 1.0 below is not laziness, it is the only value those models
  # accept, and writing 0.0 here would earn an immediate 400 naming the field.
  # Models that DO accept sampling (Sonnet 4.6, Haiku 4.5 -- see the third
  # example) can use the benchmark default of 0.0.
  #
  # ⚠ SEED. The Messages API has no seed parameter. Leave it null; the client
  # REFUSES to run with a seed set rather than record a seeded run that was not
  # seeded.
  #
  # Pricing retrieved 2026-08-25.
  #
  # - key: claude-opus-5
  #   display_name: Claude Opus 5
  #   base_url: https://api.anthropic.com/v1
  #   api_key_env: ANTHROPIC_API_KEY              # TODO-PLACEHOLDER(vault-path):
  #                                               # secret/data/capstone-ida/<env>/anthropic
  #   enabled: true
  #   timeout_s: 120
  #   max_retries: 4
  #   tags: [cloud, frontier, baseline, anthropic]
  #   serving:
  #     model_id: claude-opus-5                   # exact id sent in the body
  #     serving_stack: anthropic_compat
  #     serving_version: null                     # provider does not report one
  #     quantization: unknown                     # hosted APIs never tell us
  #     revision: null                            # no snapshot pinning offered
  #     context_window: 1000000
  #     hardware: null
  #     sampling:
  #       temperature: 1.0                        # see SAMPLING note above
  #       top_p: 1.0
  #       max_tokens: 2048                        # REQUIRED by the Messages API
  #       seed: null                              # unsupported; see SEED note
  #   cost:
  #     input_usd_per_mtok: 5.00
  #     output_usd_per_mtok: 25.00
  #
  # - key: claude-sonnet-4-6
  #   display_name: Claude Sonnet 4.6
  #   base_url: https://api.anthropic.com/v1
  #   api_key_env: ANTHROPIC_API_KEY
  #   enabled: true
  #   timeout_s: 120
  #   max_retries: 4
