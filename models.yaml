  #     quantization: unknown
  #     revision: null
  #     context_window: 1000000
  #     hardware: null
  #     sampling:
  #       temperature: 0.0                        # 4.6 still accepts sampling...
  #       top_p: 1.0                              # ...but NOT both non-default
  #       max_tokens: 2048
  #       seed: null
  #   cost:
  #     input_usd_per_mtok: 3.00
