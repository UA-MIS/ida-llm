[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ida-core"
version = "0.1.0"
description = "Shared settings, ORM models and schemas for the IDA-LLM platform."
requires-python = ">=3.12"
dependencies = [
  "pydantic>=2.9,<3",
  "pydantic-settings>=2.5,<3",
  "sqlalchemy>=2.0,<3",
]

[tool.setuptools.packages.find]
where = ["src"]
