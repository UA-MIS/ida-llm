[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ida-core"
version = "0.1.0"
description = "Capstone-IDA frozen contracts: pydantic models, DB schema, JSON Schemas, queue + artifact-store conventions."
requires-python = ">=3.12"
dependencies = [
    "pydantic~=2.9",
    "pydantic-settings~=2.5",
    "sqlalchemy~=2.0",
    "alembic~=1.13",
    "pyyaml~=6.0",
    "jsonschema~=4.23",
    "redis~=5.1",
    "boto3~=1.35",
]

[project.optional-dependencies]
postgres = ["psycopg[binary]~=3.2"]

[tool.setuptools.packages.find]
include = ["ida_core*"]

[tool.setuptools.package-data]
# Migrations moved to the repo-root `migrations/` (the alembic.ini, the CI
# `migrations` job, Dockerfile.python and the api's migrate initContainer all
# point there), so they are no longer package data.
ida_core = ["schemas/*.json"]
