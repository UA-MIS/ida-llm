[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
# THE capstone deliverable: a STANDALONE, installable benchmark harness. It
# depends on ida-core only for settings; it must stay usable outside this repo
# (`pip install ida-harness` and run a suite), so do not reach into ida_api or
# ida_runner from here.
name = "ida-harness"
version = "0.1.0"
description = "Standalone LLM benchmark harness: load a task suite, run it, score it."
requires-python = ">=3.12"
dependencies = [
  "pyyaml>=6.0,<7",
  "httpx>=0.28,<0.29",
]

[project.scripts]
ida-validate-tasks = "ida_harness.validate:main"

[tool.setuptools.packages.find]
where = ["src"]
