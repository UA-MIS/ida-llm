[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ida-harness"
version = "0.1.0"
description = "Capstone-IDA evaluation harness: task loading, OpenAI-compatible client, scoring, run orchestration."
requires-python = ">=3.12"
dependencies = [
    "ida-core==0.1.0",
    "httpx~=0.27",
    "pydantic~=2.9",
]

[tool.setuptools.packages.find]
include = ["ida_harness*"]
