outcomes:
- id: SLO1
  title: Problem Solving
  statement: Students assess a business problem, choose and apply the appropriate business tools necessary
    for concise analysis, and propose suitable strategic solutions.
  text_benchmarkable: true
  benchmark_note: Judged, not checked. The outcome is about tool CHOICE and the fit between a diagnosis
    and a recommendation, which has no single right answer; a family that scored it against a gold answer
    would be measuring agreement with one analyst rather than the reasoning the outcome names.
- id: SLO2
  title: Quantitative Literacy
  statement: Students analyze, solve, and communicate effectively regarding quantitative business problems
    using appropriate software, data sources, and tools.
  text_benchmarkable: true
  benchmark_note: 'The one outcome that is straightforwardly checkable: a break-even volume or a contribution
    margin is a number, and a wrong method lands far enough away to be told apart from a rounding difference.'
- id: SLO3
  title: Global Perspective
  statement: Students demonstrate knowledge of global factors, global systems, and cross-cultural variations
    and their role in business decisions.
  text_benchmarkable: true
  benchmark_note: Judged. The knowledge half could be quizzed, but the outcome's verb phrase is "and their
    role in business decisions" -- the part worth measuring is whether a global factor is carried into
    a decision, which is a judgement about an argument.
- id: SLO4
  title: Cultural and Societal Perspective
  statement: Students will evaluate how cultural and societal aspects influence business decisions and
    practices in domestic and international contexts.
  text_benchmarkable: true
  benchmark_note: Judged. "Evaluate" is the operative verb, and the failure mode worth catching -- reaching
    for a national stereotype instead of an evaluation -- is visible only to a rubric.
- id: SLO5
  title: Teamwork
  statement: Students demonstrate ability to work effectively on teams including contributing, communicating,
    and dealing with conflict.
  text_benchmarkable: false
  benchmark_note: OUT OF SCOPE for a text benchmark, and deliberately not faked. The outcome is about
    behaviour inside a real group over time; a single-turn prompt can at best measure whether a model
    can WRITE about teamwork, which is SLO7 wearing a different label. Measuring that and filing it under
    SLO5 would be the most misleading thing in this repository.
- id: SLO6
  title: Ethical Reasoning
  statement: Students demonstrate knowledge of ethical principles and concepts and their implications
    for business decisions.
  text_benchmarkable: true
  benchmark_note: Judged. Scoring an ethics case against a gold verdict would grade the conclusion; the
    outcome names the reasoning, so the rubric grades whether the principle invoked actually governs the
    facts.
- id: SLO7
  title: Written Communication
  statement: Students construct written messages that are professionally and strategically appropriate
    for a variety of business contexts.
  text_benchmarkable: true
  benchmark_note: 'Judged, and the outcome where a judge is least controversial: the artefact being graded
    is the text itself, which is exactly what the judge sees.'
- id: SLO8
  title: Oral Communication
  statement: Students make effective oral presentations that are informative as well as persuasive, as
    appropriate.
  text_benchmarkable: false
  benchmark_note: OUT OF SCOPE for a text benchmark. Delivery, timing and audience response are the outcome;
    a transcript is not a presentation. A speaker-notes task would measure SLO7.
- id: SLO9
  title: General Business Knowledge
  statement: Students will demonstrate a comprehensive understanding of core business principles.
  text_benchmarkable: true
  benchmark_note: Checkable. "Comprehensive understanding of core principles" is the one outcome where
    breadth matters more than depth, which is what a wide forced-choice family measures well and an essay
    measures badly.
use_modes:
- id: capability
  title: Capability
  statement: Can the model itself produce work that would satisfy the outcome, given the same prompt a
    student is given? The model is the candidate.
  in_use: true
- id: assistive
  title: Assistive
  statement: Does the model improve a student's own work against the outcome without doing it for them
    -- feedback, critique, a next question? The model is a tutor and the student is the candidate.
  in_use: false
- id: instructional
  title: Instructional
  statement: Can the model do the instructor's side of the outcome -- author an item, apply a marking
    key, grade against a rubric? The model is staff.
  in_use: false
